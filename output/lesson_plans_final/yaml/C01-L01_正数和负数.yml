objectives:
- 说出并解释认识正数、负数和 0，使用本节规范术语表达。
- 按规范步骤完成正数、负数和 0 的意义，并说明关键依据。
- 判断并订正与“结合实际情境准确确定正负方向和基准”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 正数、负数和 0 的意义
- 相反意义的量的表示
difficulties:
- 结合实际情境准确确定正负方向和基准
methods:
- 问题引导
- 比较归纳
- 正反例辨析
media:
- PPT
- 黑板
- 反馈卡
- 步骤卡
blackboard:
  title: 正数和负数
  lines:
  - 核心：大于 $0$ 的数是正数，小于 $0$ 的数是负数，$0$ 既不是正数也不是负数。
  - 方法：先定基准和正方向，再用正负号表示相反意义的量。
  - 例题：写出下列量：收入 80 元、支出 35 元。 答：规定收入为正，则分别记作 $+80$ 元、$-35$ 元。
  - 易错：判断：$0$ 是最小的正数。 纠正：错误；$0$ 既不是正数也不是负数。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 情境引入
  page: 2
  teacher:
    questions:
    - 某地白天气温为零上 $6^\circ\mathrm C$，夜间为零下 $4^\circ\mathrm C$，怎样用数区分？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 零上记作 $+6$，零下记作 $-4$，$0$ 是正负的分界。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 零上记作 $+6$，零下记作 $-4$，$0$ 是正负的分界。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 比较与抽象
  page: 2
  teacher:
    questions:
    - 正数、负数和 $0$ 分别怎样判断？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 大于 $0$ 的数是正数，小于 $0$ 的数是负数，$0$ 既不是正数也不是负数。
    correction:
    - 用反例检查是否真正满足条件，提醒按“先定基准和正方向，再用正负号表示相反意义的量”说明。
    example:
    - 基础例题：写出下列量：收入 80 元、支出 35 元。 规范解答：规定收入为正，则分别记作 $+80$ 元、$-35$ 元。
    practice:
    - 即时练习：把 $-7,+2.5,0,-\frac13$ 分成正数、负数和 $0$。 答案：正数 $+2.5$；负数 $-7,-\frac13$；$0$ 单列。
    summary:
    - 先定基准和正方向，再用正负号表示相反意义的量
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 大于 $0$ 的数是正数，小于 $0$ 的数是负数，$0$ 既不是正数也不是负数。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
- stage: 正例示范
  page: 2
  teacher:
    questions:
    - 解答“海拔 $-12$ m 表示什么？若高于海平面 8 m 怎样记？”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：表示低于海平面 12 m；高于海平面 8 m 记作 $+8$ m。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：海拔 $-12$ m 表示什么？若高于海平面 8 m 怎样记？ 解答：表示低于海平面 12 m；高于海平面 8 m 记作 $+8$ m。
    practice:
    - 对应练习：向东走 5 m 记作 $+5$ m，向西走 3 m 怎样记？ 答案：$-3$ m。
    summary:
    - 解题流程：先定基准和正方向，再用正负号表示相反意义的量。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 表示低于海平面 12 m；高于海平面 8 m 记作 $+8$ m。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 7
- stage: 表示与应用
  page: 3
  teacher:
    questions:
    - 某水库水位比警戒线高 0.6 m 记作 $+0.6$ m，低 0.25 m 怎样记并解释？
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - 记作 $-0.25$ m，负号表示低于警戒线这一基准。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：某水库水位比警戒线高 0.6 m 记作 $+0.6$ m，低 0.25 m 怎样记并解释？ 解答：记作 $-0.25$ m，负号表示低于警戒线这一基准。
    practice:
    - 即时变式：允许误差为 $\pm0.2$ mm，$+0.1$ mm 表示什么？ 答案：比标准长度长 $0.1$ mm。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - 记作 $-0.25$ m，负号表示低于警戒线这一基准。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 易错辨析
  page: 3
  teacher:
    questions:
    - 判断：$0$ 是最小的正数。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 错误；$0$ 既不是正数也不是负数。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：判断：$0$ 是最小的正数。
    practice:
    - 纠错要求：写出第一处错误，并按“先定基准和正方向，再用正负号表示相反意义的量”重做。参考：错误；$0$ 既不是正数也不是负数。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 错误；$0$ 既不是正数也不是负数。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 归纳迁移
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①把 $-7,+2.5,0,-\frac13$ 分成正数、负数和 $0$。 ②向东走 5 m 记作 $+5$ m，向西走 3 m 怎样记？ ③允许误差为 $\pm0.2$ mm，$+0.1$ mm 表示什么？；完成后按答案自查。
    explanation:
    - 答案：①正数 $+2.5$；负数 $-7,-\frac13$；$0$ 单列。 ②$-3$ m。 ③比标准长度长 $0.1$ mm。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：写出下列量：收入 80 元、支出 35 元。 学有余力者换一种方法说明；答案要点：规定收入为正，则分别记作 $+80$ 元、$-35$ 元。
    summary:
    - 先定基准和正方向，再用正负号表示相反意义的量
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“先定基准和正方向，再用正负号表示相反意义的量”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 5
- stage: 当堂检测
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，正数、负数和 $0$ 分别怎样判断？ ②2 分，向东走 5 m 记作 $+5$ m，向西走 3 m 怎样记？ ③2 分，判断：$0$ 是最小的正数。 ④4 分，某水库水位比警戒线高 0.6 m 记作
      $+0.6$ m，低 0.25 m 怎样记并解释？
    explanation:
    - 参考答案：①大于 $0$ 的数是正数，小于 $0$ 的数是负数，$0$ 既不是正数也不是负数。 ②$-3$ m。 ③错误；$0$ 既不是正数也不是负数。 ④记作 $-0.25$ m，负号表示低于警戒线这一基准。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 6
- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①把 $-7,+2.5,0,-\frac13$ 分成正数、负数和 $0$。 ②向东走 5 m 记作 $+5$ m，向西走 3 m 怎样记？ ③允许误差为 $\pm0.2$ mm，$+0.1$ mm 表示什么？ ④判断：$0$
      是最小的正数。；答案：①正数 $+2.5$；负数 $-7,-\frac13$；$0$ 单列。 ②$-3$ m。 ③比标准长度长 $0.1$ mm。 ④错误；$0$ 既不是正数也不是负数。。B 组：①海拔 $-12$ m 表示什么？若高于海平面
      8 m 怎样记？ ②某水库水位比警戒线高 0.6 m 记作 $+0.6$ m，低 0.25 m 怎样记并解释？；答案要点：①表示低于海平面 12 m；高于海平面 8 m 记作 $+8$ m。 ②记作 $-0.25$ m，负号表示低于警戒线这一基准。。C
      组选做：围绕“正数和负数”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：先定基准和正方向，再用正负号表示相反意义的量。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“先定基准和正方向，再用正负号表示相反意义的量”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
  minutes: 4
