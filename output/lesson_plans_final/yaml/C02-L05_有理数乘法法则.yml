objectives:
- 说出并解释有理数乘法符号规律，使用本节规范术语表达。
- 按规范步骤完成有理数乘法法则，并说明关键依据。
- 判断并订正与“负负得正的合理性理解”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 有理数乘法法则
- 积的符号判断
difficulties:
- 负负得正的合理性理解
methods:
