blackboard:
  title: 有理数乘法法则
  lines:
  - 核心：同号得正、异号得负，并把绝对值相乘；任何数与 $0$ 相乘得 $0$。
  - 方法：先判符号，再乘绝对值，最后检查零因数。
  - 例题：计算 $(-6)\times4$。 答：异号得负，$6\times4=24$，结果 $-24$。
  - 易错：错解：$(-3)\times(-5)=-15$。 纠正：错误；同号得正，应为 $15$。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 依据复习
  page: 2
  teacher:
    questions:
    - 温度每小时下降 $3^\circ\mathrm C$，4 小时共变化多少？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 每小时变化记作 $-3$，共变化 $(-3)\times4=-12$。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 每小时变化记作 $-3$，共变化 $(-3)\times4=-12$。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 尝试与归纳
  page: 2
  teacher:
    questions:
    - 有理数乘法如何确定积的符号和绝对值？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 同号得正、异号得负，并把绝对值相乘；任何数与 $0$ 相乘得 $0$。
    correction:
    - 用反例检查是否真正满足条件，提醒按“先判符号，再乘绝对值，最后检查零因数”说明。
    example:
    - 基础例题：计算 $(-6)\times4$。 规范解答：异号得负，$6\times4=24$，结果 $-24$。
    practice:
    - 即时练习：计算 $5\times(-7)$。 答案：$-35$。
    summary:
    - 先判符号，再乘绝对值，最后检查零因数
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 同号得正、异号得负，并把绝对值相乘；任何数与 $0$ 相乘得 $0$。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
- stage: 规范示范
  page: 2
  teacher:
    questions:
    - 解答“计算 $(-\frac23)\times(-\frac94)$。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：同号得正，约分后得 $\frac32$。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：计算 $(-\frac23)\times(-\frac94)$。 解答：同号得正，约分后得 $\frac32$。
    practice:
    - 对应练习：计算 $(-8)\times(-0.5)$。 答案：$4$。
    summary:
    - 解题流程：先判符号，再乘绝对值，最后检查零因数。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 同号得正，约分后得 $\frac32$。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 8
- stage: 变式训练
  page: 3
  teacher:
    questions:
    - 水位每天降低 0.4 m，连续 6 天的总变化怎样表示？
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - $(-0.4)\times6=-2.4$ m。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：水位每天降低 0.4 m，连续 6 天的总变化怎样表示？ 解答：$(-0.4)\times6=-2.4$ m。
    practice:
    - 即时变式：计算 $0\times(-12)$。 答案：$0$。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - $(-0.4)\times6=-2.4$ m。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 错解诊断
  page: 3
  teacher:
    questions:
    - 错解：$(-3)\times(-5)=-15$。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 错误；同号得正，应为 $15$。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错解：$(-3)\times(-5)=-15$。
    practice:
    - 纠错要求：写出第一处错误，并按“先判符号，再乘绝对值，最后检查零因数”重做。参考：错误；同号得正，应为 $15$。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 错误；同号得正，应为 $15$。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 综合练习
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①计算 $5\times(-7)$。 ②计算 $(-8)\times(-0.5)$。 ③计算 $0\times(-12)$。；完成后按答案自查。
    explanation:
    - 答案：①$-35$。 ②$4$。 ③$0$。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：计算 $(-6)\times4$。 学有余力者换一种方法说明；答案要点：异号得负，$6\times4=24$，结果 $-24$。
    summary:
    - 先判符号，再乘绝对值，最后检查零因数
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“先判符号，再乘绝对值，最后检查零因数”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 4
- stage: 当堂检测
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，有理数乘法如何确定积的符号和绝对值？ ②2 分，计算 $(-8)\times(-0.5)$。 ③2 分，错解：$(-3)\times(-5)=-15$。 ④4 分，水位每天降低 0.4 m，连续 6
      天的总变化怎样表示？
    explanation:
    - 参考答案：①同号得正、异号得负，并把绝对值相乘；任何数与 $0$ 相乘得 $0$。 ②$4$。 ③错误；同号得正，应为 $15$。 ④$(-0.4)\times6=-2.4$ m。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 6
- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①计算 $5\times(-7)$。 ②计算 $(-8)\times(-0.5)$。 ③计算 $0\times(-12)$。 ④错解：$(-3)\times(-5)=-15$。；答案：①$-35$。 ②$4$。 ③$0$。
      ④错误；同号得正，应为 $15$。。B 组：①计算 $(-\frac23)\times(-\frac94)$。 ②水位每天降低 0.4 m，连续 6 天的总变化怎样表示？；答案要点：①同号得正，约分后得 $\frac32$。 ②$(-0.4)\times6=-2.4$
      m。。C 组选做：围绕“有理数乘法法则”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：先判符号，再乘绝对值，最后检查零因数。课后反思区域由任课教师课后填写。
  student:
