objectives:
- 说出并解释在活动中巩固有理数运算，使用本节规范术语表达。
- 按规范步骤完成有理数运算综合应用，并说明关键依据。
- 判断并订正与“从计算结果中抽象规律”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 有理数运算综合应用
- 活动中的规律表达
difficulties:
- 从计算结果中抽象规律
methods:
- 操作探究
- 合作交流
- 成果互评
media:
- PPT
- 黑板
- 反馈卡
- 任务单
- 小组记录表
blackboard:
  title: 有理数运算数学活动
  lines:
  - 核心：先确定运算顺序，再分类枚举括号位置和符号，逐一计算并排除重复。
  - 方法：分类枚举、规范记录、独立计算、反向检验。
  - 例题：用 $-2,3,4$ 各一次组成结果为 10 的算式。 答：$(-2)+3\times4=10$。
  - 易错：错误策略：只找到一个结果就认定没有其他方案。 纠正：应按运算类型和括号位置分类，说明枚举是否完整。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 任务说明
  page: 2
  teacher:
    questions:
    - 给定数字 $2,3,4,6$ 和运算符号，能否各用一次组成结果为 24 的算式？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 可以写成 $6\times4\div(3-2)=24$；还要按运算类型和括号位置有序寻找其他方案。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 可以写成 $6\times4\div(3-2)=24$；还要按运算类型和括号位置有序寻找其他方案。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 独立尝试
  page: 2
  teacher:
    questions:
    - 怎样组织有理数运算探究避免无序试算？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 先确定运算顺序，再分类枚举括号位置和符号，逐一计算并排除重复。
    correction:
    - 用反例检查是否真正满足条件，提醒按“分类枚举、规范记录、独立计算、反向检验”说明。
    example:
    - 基础例题：用 $-2,3,4$ 各一次组成结果为 10 的算式。 规范解答：$(-2)+3\times4=10$。
    practice:
    - 即时练习：给运算方案编号并记录结果。 答案：表格完整、计算正确即可。
    summary:
    - 分类枚举、规范记录、独立计算、反向检验
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 先确定运算顺序，再分类枚举括号位置和符号，逐一计算并排除重复。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
- stage: 小组探究
  page: 2
  teacher:
    questions:
    - 解答“比较 $(-3)^2$、$-3^2$、$(-3)^3$ 的值。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：分别为 $9,-9,-27$。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：比较 $(-3)^2$、$-3^2$、$(-3)^3$ 的值。 解答：分别为 $9,-9,-27$。
    practice:
    - 对应练习：交换两个数的位置，结果是否一定不变？ 答案：不一定，减法和除法一般会改变。
    summary:
    - 解题流程：分类枚举、规范记录、独立计算、反向检验。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 分别为 $9,-9,-27$。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 8
- stage: 展示交流
  page: 3
  teacher:
    questions:
    - 设计一道含负数、括号和乘方的 24 点任务，并给出一种解法。
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - 题目合法、每个数按规则使用且结果为 24 即可。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：设计一道含负数、括号和乘方的 24 点任务，并给出一种解法。 解答：题目合法、每个数按规则使用且结果为 24 即可。
    practice:
    - 即时变式：用估算检查结果符号是否合理。 答案：先按负因数个数或加数大小判断。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - 题目合法、每个数按规则使用且结果为 24 即可。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 7
- stage: 错误修正
  page: 3
  teacher:
    questions:
    - 错误策略：只找到一个结果就认定没有其他方案。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 应按运算类型和括号位置分类，说明枚举是否完整。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错误策略：只找到一个结果就认定没有其他方案。
    practice:
    - 纠错要求：写出第一处错误，并按“分类枚举、规范记录、独立计算、反向检验”重做。参考：应按运算类型和括号位置分类，说明枚举是否完整。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 应按运算类型和括号位置分类，说明枚举是否完整。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 迁移应用
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①给运算方案编号并记录结果。 ②交换两个数的位置，结果是否一定不变？ ③用估算检查结果符号是否合理。；完成后按答案自查。
    explanation:
    - 答案：①表格完整、计算正确即可。 ②不一定，减法和除法一般会改变。 ③先按负因数个数或加数大小判断。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：用 $-2,3,4$ 各一次组成结果为 10 的算式。 学有余力者换一种方法说明；答案要点：$(-2)+3\times4=10$。
    summary:
    - 分类枚举、规范记录、独立计算、反向检验
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“分类枚举、规范记录、独立计算、反向检验”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 4
- stage: 反馈评价
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，怎样组织有理数运算探究避免无序试算？ ②2 分，交换两个数的位置，结果是否一定不变？ ③2 分，错误策略：只找到一个结果就认定没有其他方案。 ④4 分，设计一道含负数、括号和乘方的 24 点任务，并给出一种解法。
    explanation:
    - 参考答案：①先确定运算顺序，再分类枚举括号位置和符号，逐一计算并排除重复。 ②不一定，减法和除法一般会改变。 ③应按运算类型和括号位置分类，说明枚举是否完整。 ④题目合法、每个数按规则使用且结果为 24 即可。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 5
- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①给运算方案编号并记录结果。 ②交换两个数的位置，结果是否一定不变？ ③用估算检查结果符号是否合理。 ④错误策略：只找到一个结果就认定没有其他方案。；答案：①表格完整、计算正确即可。 ②不一定，减法和除法一般会改变。 ③先按负因数个数或加数大小判断。
      ④应按运算类型和括号位置分类，说明枚举是否完整。。B 组：①比较 $(-3)^2$、$-3^2$、$(-3)^3$ 的值。 ②设计一道含负数、括号和乘方的 24 点任务，并给出一种解法。；答案要点：①分别为 $9,-9,-27$。
      ②题目合法、每个数按规则使用且结果为 24 即可。。C 组选做：围绕“有理数运算数学活动”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：分类枚举、规范记录、独立计算、反向检验。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“分类枚举、规范记录、独立计算、反向检验”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
  minutes: 4
