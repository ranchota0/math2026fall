objectives:
- 说出并解释用一元一次方程解决配套问题，使用本节规范术语表达。
- 按规范步骤完成实际问题中的相等关系，并说明关键依据。
- 判断并订正与“把实际语言转化为方程中的数量关系”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 实际问题中的相等关系
- 配套和盈亏模型
difficulties:
- 把实际语言转化为方程中的数量关系
methods:
- 情境分析
- 数量关系建模
- 检验解释
media:
- PPT
- 黑板
- 反馈卡
- 步骤卡
blackboard:
  title: 实际问题与一元一次方程一
  lines:
  - 核心：审题找数量、设未知数、表示相关量、找相等关系、列方程求解、检验并作答。
  - 方法：设元、表示、找等量、列方程、求解、检验、作答。
  - 例题：某车间加工零件，甲每天 35 个，乙每天 25 个，共加工 300 个，合作几天？ 答：设 $x$ 天，列 $(35+25)x=300$，解得 $x=5$。
  - 易错：错设：售价比成本高 20 元写成售价 $x-20$。 纠正：若设成本为 $x$，售价应为 $x+20$。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 问题情境
  page: 2
  teacher:
    questions:
    - 一套桌椅中桌子与椅子数量有固定配套关系，怎样用方程表示缺少的一类数量？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 先设未知数，按每套所需数量表示两类总量，再用现有数量相等关系列方程。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 先设未知数，按每套所需数量表示两类总量，再用现有数量相等关系列方程。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 数量关系
  page: 2
  teacher:
    questions:
    - 实际问题列方程的通用步骤是什么？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 审题找数量、设未知数、表示相关量、找相等关系、列方程求解、检验并作答。
    correction:
    - 用反例检查是否真正满足条件，提醒按“设元、表示、找等量、列方程、求解、检验、作答”说明。
    example:
    - 基础例题：某车间加工零件，甲每天 35 个，乙每天 25 个，共加工 300 个，合作几天？ 规范解答：设 $x$ 天，列 $(35+25)x=300$，解得 $x=5$。
    practice:
    - 即时练习：每套配 1 张桌子和 4 把椅子，现有椅子 36 把，可配几套？ 答案：$4x=36$，$x=9$。
    summary:
    - 设元、表示、找等量、列方程、求解、检验、作答
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 审题找数量、设未知数、表示相关量、找相等关系、列方程求解、检验并作答。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
- stage: 模型求解
  page: 2
  teacher:
    questions:
    - 解答“商品原价 $x$ 元，八折后比原价少 40 元，求原价。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：$x-0.8x=40$，$0.2x=40$，$x=200$ 元。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：商品原价 $x$ 元，八折后比原价少 40 元，求原价。 解答：$x-0.8x=40$，$0.2x=40$，$x=200$ 元。
    practice:
    - 对应练习：售价 150 元比成本高 25%，求成本。 答案：$1.25x=150$，$x=120$ 元。
    summary:
    - 解题流程：设元、表示、找等量、列方程、求解、检验、作答。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 $x-0.8x=40$，$0.2x=40$，$x=200$ 元。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 8
- stage: 变式解释
  page: 3
  teacher:
    questions:
    - 两队共植树 96 棵，甲队比乙队多 12 棵，求两队棵数。
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - 设乙队 $x$ 棵，$x+(x+12)=96$，得乙 42、甲 54 棵。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：两队共植树 96 棵，甲队比乙队多 12 棵，求两队棵数。 解答：设乙队 $x$ 棵，$x+(x+12)=96$，得乙 42、甲 54 棵。
    practice:
    - 即时变式：列方程后为什么要写答语？ 答案：要把数学解还原为实际量并检查单位与合理性。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - 设乙队 $x$ 棵，$x+(x+12)=96$，得乙 42、甲 54 棵。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 错误诊断
  page: 3
  teacher:
    questions:
    - 错设：售价比成本高 20 元写成售价 $x-20$。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 若设成本为 $x$，售价应为 $x+20$。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错设：售价比成本高 20 元写成售价 $x-20$。
    practice:
    - 纠错要求：写出第一处错误，并按“设元、表示、找等量、列方程、求解、检验、作答”重做。参考：若设成本为 $x$，售价应为 $x+20$。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 若设成本为 $x$，售价应为 $x+20$。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 方案迁移
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①每套配 1 张桌子和 4 把椅子，现有椅子 36 把，可配几套？ ②售价 150 元比成本高 25%，求成本。 ③列方程后为什么要写答语？；完成后按答案自查。
    explanation:
    - 答案：①$4x=36$，$x=9$。 ②$1.25x=150$，$x=120$ 元。 ③要把数学解还原为实际量并检查单位与合理性。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：某车间加工零件，甲每天 35 个，乙每天 25 个，共加工 300 个，合作几天？ 学有余力者换一种方法说明；答案要点：设 $x$ 天，列 $(35+25)x=300$，解得 $x=5$。
    summary:
    - 设元、表示、找等量、列方程、求解、检验、作答
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“设元、表示、找等量、列方程、求解、检验、作答”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 4
- stage: 当堂检测
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，实际问题列方程的通用步骤是什么？ ②2 分，售价 150 元比成本高 25%，求成本。 ③2 分，错设：售价比成本高 20 元写成售价 $x-20$。 ④4 分，两队共植树 96 棵，甲队比乙队多 12
      棵，求两队棵数。
    explanation:
    - 参考答案：①审题找数量、设未知数、表示相关量、找相等关系、列方程求解、检验并作答。 ②$1.25x=150$，$x=120$ 元。 ③若设成本为 $x$，售价应为 $x+20$。 ④设乙队 $x$ 棵，$x+(x+12)=96$，得乙
      42、甲 54 棵。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 6
- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①每套配 1 张桌子和 4 把椅子，现有椅子 36 把，可配几套？ ②售价 150 元比成本高 25%，求成本。 ③列方程后为什么要写答语？ ④错设：售价比成本高 20 元写成售价 $x-20$。；答案：①$4x=36$，$x=9$。
      ②$1.25x=150$，$x=120$ 元。 ③要把数学解还原为实际量并检查单位与合理性。 ④若设成本为 $x$，售价应为 $x+20$。。B 组：①商品原价 $x$ 元，八折后比原价少 40 元，求原价。 ②两队共植树 96 棵，甲队比乙队多
      12 棵，求两队棵数。；答案要点：①$x-0.8x=40$，$0.2x=40$，$x=200$ 元。 ②设乙队 $x$ 棵，$x+(x+12)=96$，得乙 42、甲 54 棵。。C 组选做：围绕“实际问题与一元一次方程一”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：设元、表示、找等量、列方程、求解、检验、作答。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“设元、表示、找等量、列方程、求解、检验、作答”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
  minutes: 4
