objectives:
- 说出并解释等式的性质 1，使用本节规范术语表达。
- 按规范步骤完成等式的性质，并说明关键依据。
- 判断并订正与“等式两边同乘或同除时条件的理解”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 等式的性质
- 用等式性质解方程
difficulties:
- 等式两边同乘或同除时条件的理解
methods:
- 问题引导
