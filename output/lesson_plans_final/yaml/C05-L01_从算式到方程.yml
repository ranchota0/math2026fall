objectives:
- 说出并解释从实际问题列出含未知数的等式，使用本节规范术语表达。
- 按规范步骤完成方程的概念，并说明关键依据。
- 判断并订正与“从实际问题中找相等关系”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 方程的概念
- 根据相等关系列方程
difficulties:
- 从实际问题中找相等关系
methods:
- 问题引导
- 比较归纳
- 正反例辨析
media:
- PPT
- 黑板
- 反馈卡
- 步骤卡
blackboard:
  title: 从算式到方程
  lines:
  - 核心：含有未知数的等式叫方程；先设未知数，再找相等关系并把两边数量写成式子。
  - 方法：设未知数、表示相关量、找相等关系、列方程。
  - 例题：判断 $3x+5=20$、$2+3=5$、$4x-1$ 哪些是方程。 答：只有 $3x+5=20$ 是方程，因为含未知数且是等式。
  - 易错：错例：把“5 与 $x$ 的和是 12”列成 $5x=12$。 纠正：错误；“和”表示加法，应为 $5+x=12$。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 情境引入
  page: 2
  teacher:
    questions:
    - 一辆车按计划行驶，已走 120 km，还需行 $x$ km，总路程 300 km，怎样表示相等关系？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 可列方程 $120+x=300$。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 可列方程 $120+x=300$。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 比较与抽象
  page: 2
  teacher:
    questions:
    - 什么是方程，怎样从算式过渡到方程？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 含有未知数的等式叫方程；先设未知数，再找相等关系并把两边数量写成式子。
    correction:
    - 用反例检查是否真正满足条件，提醒按“设未知数、表示相关量、找相等关系、列方程”说明。
    example:
    - 基础例题：判断 $3x+5=20$、$2+3=5$、$4x-1$ 哪些是方程。 规范解答：只有 $3x+5=20$ 是方程，因为含未知数且是等式。
    practice:
    - 即时练习：判断 $x>4$ 是否为方程。 答案：不是，它是不等式。
    summary:
    - 设未知数、表示相关量、找相等关系、列方程
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 含有未知数的等式叫方程；先设未知数，再找相等关系并把两边数量写成式子。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
- stage: 正例示范
  page: 2
  teacher:
    questions:
    - 解答“一个数的 2 倍加 3 等于 15，列方程。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：设这个数为 $x$，列 $2x+3=15$。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：一个数的 2 倍加 3 等于 15，列方程。 解答：设这个数为 $x$，列 $2x+3=15$。
    practice:
    - 对应练习：比 $x$ 少 7 的数等于 12，列方程。 答案：$x-7=12$。
    summary:
    - 解题流程：设未知数、表示相关量、找相等关系、列方程。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 设这个数为 $x$，列 $2x+3=15$。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 7
- stage: 表示与应用
  page: 3
  teacher:
    questions:
    - 买 4 本同价练习本共 28 元，设单价为 $x$ 元，列方程。
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - $4x=28$。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：买 4 本同价练习本共 28 元，设单价为 $x$ 元，列方程。 解答：$4x=28$。
    practice:
    - 即时变式：某数的三分之一为 5，列方程。 答案：$\frac x3=5$。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - $4x=28$。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 易错辨析
  page: 3
  teacher:
    questions:
    - 错例：把“5 与 $x$ 的和是 12”列成 $5x=12$。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 错误；“和”表示加法，应为 $5+x=12$。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错例：把“5 与 $x$ 的和是 12”列成 $5x=12$。
    practice:
    - 纠错要求：写出第一处错误，并按“设未知数、表示相关量、找相等关系、列方程”重做。参考：错误；“和”表示加法，应为 $5+x=12$。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 错误；“和”表示加法，应为 $5+x=12$。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 归纳迁移
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①判断 $x>4$ 是否为方程。 ②比 $x$ 少 7 的数等于 12，列方程。 ③某数的三分之一为 5，列方程。；完成后按答案自查。
    explanation:
    - 答案：①不是，它是不等式。 ②$x-7=12$。 ③$\frac x3=5$。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：判断 $3x+5=20$、$2+3=5$、$4x-1$ 哪些是方程。 学有余力者换一种方法说明；答案要点：只有 $3x+5=20$ 是方程，因为含未知数且是等式。
    summary:
    - 设未知数、表示相关量、找相等关系、列方程
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“设未知数、表示相关量、找相等关系、列方程”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 5
- stage: 当堂检测
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，什么是方程，怎样从算式过渡到方程？ ②2 分，比 $x$ 少 7 的数等于 12，列方程。 ③2 分，错例：把“5 与 $x$ 的和是 12”列成 $5x=12$。 ④4 分，买 4 本同价练习本共
      28 元，设单价为 $x$ 元，列方程。
    explanation:
    - 参考答案：①含有未知数的等式叫方程；先设未知数，再找相等关系并把两边数量写成式子。 ②$x-7=12$。 ③错误；“和”表示加法，应为 $5+x=12$。 ④$4x=28$。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 6
- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①判断 $x>4$ 是否为方程。 ②比 $x$ 少 7 的数等于 12，列方程。 ③某数的三分之一为 5，列方程。 ④错例：把“5 与 $x$ 的和是 12”列成 $5x=12$。；答案：①不是，它是不等式。 ②$x-7=12$。
      ③$\frac x3=5$。 ④错误；“和”表示加法，应为 $5+x=12$。。B 组：①一个数的 2 倍加 3 等于 15，列方程。 ②买 4 本同价练习本共 28 元，设单价为 $x$ 元，列方程。；答案要点：①设这个数为 $x$，列
      $2x+3=15$。 ②$4x=28$。。C 组选做：围绕“从算式到方程”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：设未知数、表示相关量、找相等关系、列方程。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“设未知数、表示相关量、找相等关系、列方程”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
  minutes: 4
