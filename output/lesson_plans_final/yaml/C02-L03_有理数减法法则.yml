objectives:
- 说出并解释减法是加法的逆运算，使用本节规范术语表达。
- 按规范步骤完成有理数减法法则，并说明关键依据。
- 判断并订正与“减负数和括号符号变化”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 有理数减法法则
- 减法转化为加法
difficulties:
- 减负数和括号符号变化
methods:
- 复习迁移
- 规范板演
- 错例纠正
