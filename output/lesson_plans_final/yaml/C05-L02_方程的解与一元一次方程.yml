objectives:
- 说出并解释方程的解，使用本节规范术语表达。
- 按规范步骤完成方程的解，并说明关键依据。
- 判断并订正与“判断一个方程是否为一元一次方程”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 方程的解
- 一元一次方程
difficulties:
- 判断一个方程是否为一元一次方程
methods:
- 问题引导
