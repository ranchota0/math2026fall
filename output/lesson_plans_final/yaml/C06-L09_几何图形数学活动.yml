objectives:
- 说出并解释通过活动巩固几何图形、线段和角，使用本节规范术语表达。
- 按规范步骤完成几何活动探究，并说明关键依据。
- 判断并订正与“从操作活动抽象几何关系”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 几何活动探究
- 图形关系表达
difficulties:
- 从操作活动抽象几何关系
methods:
- 操作探究
- 合作交流
- 成果互评
media:
- PPT
- 黑板
- 反馈卡
- 任务单
- 小组记录表
blackboard:
  title: 几何图形数学活动
  lines:
  - 核心：每一步要写操作、观察结果和依据，图上用规范符号标记，最后交换检验。
  - 方法：规范作图、标注条件、测量或叠合验证、用符号表达。
  - 例题：画线段 $AB=8$ cm 并标出中点 $M$。 答：作出 $AM=MB=4$ cm，并用相等短线标记。
  - 易错：错误策略：只凭图形看起来相等就写中点或平分线。 纠正：必须给出已知条件、操作验证或相等标记。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 任务说明
  page: 2
  teacher:
    questions:
    - 只用直尺、圆规或折纸，怎样完成线段中点和角平分线的操作任务？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 先按操作规则作图，再用度量、叠合或相等标记验证。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 先按操作规则作图，再用度量、叠合或相等标记验证。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 独立尝试
  page: 2
  teacher:
    questions:
    - 几何数学活动怎样做到操作与说理一致？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 每一步要写操作、观察结果和依据，图上用规范符号标记，最后交换检验。
    correction:
    - 用反例检查是否真正满足条件，提醒按“规范作图、标注条件、测量或叠合验证、用符号表达”说明。
    example:
    - 基础例题：画线段 $AB=8$ cm 并标出中点 $M$。 规范解答：作出 $AM=MB=4$ cm，并用相等短线标记。
    practice:
    - 即时练习：同桌互查线段中点的两个条件。 答案：点在线段上且两段相等。
    summary:
    - 规范作图、标注条件、测量或叠合验证、用符号表达
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 每一步要写操作、观察结果和依据，图上用规范符号标记，最后交换检验。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
  figure: geometry_activity
- stage: 小组探究
  page: 2
  teacher:
    questions:
    - 解答“画 $70^\circ$ 的角并作角平分线。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：两部分各为 $35^\circ$，用相等弧标记。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：画 $70^\circ$ 的角并作角平分线。 解答：两部分各为 $35^\circ$，用相等弧标记。
    practice:
    - 对应练习：用折纸验证角平分线。 答案：两边重合时折痕通过顶点并使两角重合。
    summary:
    - 解题流程：规范作图、标注条件、测量或叠合验证、用符号表达。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 两部分各为 $35^\circ$，用相等弧标记。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 8
- stage: 展示交流
  page: 3
  teacher:
    questions:
    - 设计一幅同时含线段中点和角平分线的图，并写出四个等量关系。
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - 图形与关系一致、标记规范即可。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：设计一幅同时含线段中点和角平分线的图，并写出四个等量关系。 解答：图形与关系一致、标记规范即可。
    practice:
    - 即时变式：记录一次测量误差并说明怎样减小。 答案：如重新对准量角器中心和零刻度线。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - 图形与关系一致、标记规范即可。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 7
- stage: 错误修正
  page: 3
  teacher:
    questions:
    - 错误策略：只凭图形看起来相等就写中点或平分线。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 必须给出已知条件、操作验证或相等标记。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错误策略：只凭图形看起来相等就写中点或平分线。
    practice:
    - 纠错要求：写出第一处错误，并按“规范作图、标注条件、测量或叠合验证、用符号表达”重做。参考：必须给出已知条件、操作验证或相等标记。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 必须给出已知条件、操作验证或相等标记。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 迁移应用
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①同桌互查线段中点的两个条件。 ②用折纸验证角平分线。 ③记录一次测量误差并说明怎样减小。；完成后按答案自查。
    explanation:
    - 答案：①点在线段上且两段相等。 ②两边重合时折痕通过顶点并使两角重合。 ③如重新对准量角器中心和零刻度线。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：画线段 $AB=8$ cm 并标出中点 $M$。 学有余力者换一种方法说明；答案要点：作出 $AM=MB=4$ cm，并用相等短线标记。
    summary:
    - 规范作图、标注条件、测量或叠合验证、用符号表达
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“规范作图、标注条件、测量或叠合验证、用符号表达”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 4
- stage: 反馈评价
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，几何数学活动怎样做到操作与说理一致？ ②2 分，用折纸验证角平分线。 ③2 分，错误策略：只凭图形看起来相等就写中点或平分线。 ④4 分，设计一幅同时含线段中点和角平分线的图，并写出四个等量关系。
    explanation:
    - 参考答案：①每一步要写操作、观察结果和依据，图上用规范符号标记，最后交换检验。 ②两边重合时折痕通过顶点并使两角重合。 ③必须给出已知条件、操作验证或相等标记。 ④图形与关系一致、标记规范即可。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 5
- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①同桌互查线段中点的两个条件。 ②用折纸验证角平分线。 ③记录一次测量误差并说明怎样减小。 ④错误策略：只凭图形看起来相等就写中点或平分线。；答案：①点在线段上且两段相等。 ②两边重合时折痕通过顶点并使两角重合。 ③如重新对准量角器中心和零刻度线。
      ④必须给出已知条件、操作验证或相等标记。。B 组：①画 $70^\circ$ 的角并作角平分线。 ②设计一幅同时含线段中点和角平分线的图，并写出四个等量关系。；答案要点：①两部分各为 $35^\circ$，用相等弧标记。 ②图形与关系一致、标记规范即可。。C
      组选做：围绕“几何图形数学活动”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：规范作图、标注条件、测量或叠合验证、用符号表达。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“规范作图、标注条件、测量或叠合验证、用符号表达”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
  minutes: 4
