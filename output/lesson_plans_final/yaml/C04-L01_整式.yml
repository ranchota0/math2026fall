objectives:
- 说出并解释单项式及其系数、次数，使用本节规范术语表达。
- 按规范步骤完成单项式和多项式，并说明关键依据。
- 判断并订正与“多项式项的符号和次数判断”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 单项式和多项式
- 系数、次数、项
difficulties:
- 多项式项的符号和次数判断
methods:
- 问题引导
- 比较归纳
- 正反例辨析
