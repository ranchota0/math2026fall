- PPT
- 黑板
- 反馈卡
- 步骤卡
blackboard:
  title: 整式
  lines:
  - 核心：数或字母的积是单项式；几个单项式的和是多项式；单项式与多项式统称整式。
  - 方法：先看是否由加减分成多项，再分别确定系数、项和次数。
  - 例题：指出 $-5a^2b$ 的系数和次数。 答：系数为 $-5$，次数为 $2+1=3$。
  - 易错：错解：单项式 $-x^2y$ 的次数为 2。 纠正：错误；次数是所有字母指数和，为 3。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 情境引入
  page: 2
  teacher:
    questions:
    - 代数式 $-3x^2y$ 与 $2x-5$ 在项数和结构上有什么不同？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 前者是一个单项式，后者由两个单项式的和组成，是多项式。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 前者是一个单项式，后者由两个单项式的和组成，是多项式。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 比较与抽象
  page: 2
  teacher:
    questions:
    - 单项式、多项式和整式怎样辨认？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 数或字母的积是单项式；几个单项式的和是多项式；单项式与多项式统称整式。
    correction:
    - 用反例检查是否真正满足条件，提醒按“先看是否由加减分成多项，再分别确定系数、项和次数”说明。
    example:
    - 基础例题：指出 $-5a^2b$ 的系数和次数。 规范解答：系数为 $-5$，次数为 $2+1=3$。
    practice:
    - 即时练习：判断 $\frac2x$ 是否为整式。 答案：不是，字母在分母中。
    summary:
    - 先看是否由加减分成多项，再分别确定系数、项和次数
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 数或字母的积是单项式；几个单项式的和是多项式；单项式与多项式统称整式。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
- stage: 正例示范
  page: 2
  teacher:
    questions:
    - 解答“指出 $3x^2-2x+7$ 的项、常数项和次数。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：项为 $3x^2,-2x,7$；常数项 7；次数 2。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：指出 $3x^2-2x+7$ 的项、常数项和次数。 解答：项为 $3x^2,-2x,7$；常数项 7；次数 2。
    practice:
    - 对应练习：写出 $-ab$ 的系数。 答案：$-1$。
    summary:
    - 解题流程：先看是否由加减分成多项，再分别确定系数、项和次数。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 项为 $3x^2,-2x,7$；常数项 7；次数 2。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 7
- stage: 表示与应用
  page: 3
  teacher:
    questions:
    - 用整式表示边长为 $x$ 的正方形面积与周长，并判断类型。
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - 面积 $x^2$、周长 $4x$，都是单项式。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：用整式表示边长为 $x$ 的正方形面积与周长，并判断类型。 解答：面积 $x^2$、周长 $4x$，都是单项式。
    practice:
    - 即时变式：多项式 $x^3+2x-1$ 是几次几项式？ 答案：三次三项式。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - 面积 $x^2$、周长 $4x$，都是单项式。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 易错辨析
  page: 3
  teacher:
    questions:
    - 错解：单项式 $-x^2y$ 的次数为 2。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 错误；次数是所有字母指数和，为 3。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错解：单项式 $-x^2y$ 的次数为 2。
    practice:
    - 纠错要求：写出第一处错误，并按“先看是否由加减分成多项，再分别确定系数、项和次数”重做。参考：错误；次数是所有字母指数和，为 3。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 错误；次数是所有字母指数和，为 3。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 归纳迁移
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①判断 $\frac2x$ 是否为整式。 ②写出 $-ab$ 的系数。 ③多项式 $x^3+2x-1$ 是几次几项式？；完成后按答案自查。
    explanation:
    - 答案：①不是，字母在分母中。 ②$-1$。 ③三次三项式。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：指出 $-5a^2b$ 的系数和次数。 学有余力者换一种方法说明；答案要点：系数为 $-5$，次数为 $2+1=3$。
    summary:
    - 先看是否由加减分成多项，再分别确定系数、项和次数
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“先看是否由加减分成多项，再分别确定系数、项和次数”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 5
- stage: 当堂检测
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，单项式、多项式和整式怎样辨认？ ②2 分，写出 $-ab$ 的系数。 ③2 分，错解：单项式 $-x^2y$ 的次数为 2。 ④4 分，用整式表示边长为 $x$ 的正方形面积与周长，并判断类型。
    explanation:
    - 参考答案：①数或字母的积是单项式；几个单项式的和是多项式；单项式与多项式统称整式。 ②$-1$。 ③错误；次数是所有字母指数和，为 3。 ④面积 $x^2$、周长 $4x$，都是单项式。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 6
- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①判断 $\frac2x$ 是否为整式。 ②写出 $-ab$ 的系数。 ③多项式 $x^3+2x-1$ 是几次几项式？ ④错解：单项式 $-x^2y$ 的次数为 2。；答案：①不是，字母在分母中。 ②$-1$。 ③三次三项式。
      ④错误；次数是所有字母指数和，为 3。。B 组：①指出 $3x^2-2x+7$ 的项、常数项和次数。 ②用整式表示边长为 $x$ 的正方形面积与周长，并判断类型。；答案要点：①项为 $3x^2,-2x,7$；常数项 7；次数 2。
      ②面积 $x^2$、周长 $4x$，都是单项式。。C 组选做：围绕“整式”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：先看是否由加减分成多项，再分别确定系数、项和次数。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“先看是否由加减分成多项，再分别确定系数、项和次数”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
  minutes: 4
