      ④错误；补角只由度数和为 $180^\circ$ 决定，与位置无关。。B 组：①若 $\angle1$ 与 $\angle2$ 互补，且 $\angle1=3\angle2$，求两角。 ②已知 $\angle A=25^\circ$，$\angle
