objectives:
- 说出并解释余角和补角，使用本节规范术语表达。
- 按规范步骤完成余角，并说明关键依据。
- 判断并订正与“结合图形识别互余、互补关系”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 余角
- 补角
difficulties:
- 结合图形识别互余、互补关系
methods:
- 观察操作
- 画图标注
- 图形说理
media:
- PPT
