- 直尺
- 量角器或透明纸
blackboard:
  title: 余角和补角
  lines:
  - 核心：同角或等角的余角相等，同角或等角的补角相等；判断关系必须看角度和。
  - 方法：先判断和为 90 还是 180，再列关系式；位置不能代替数量条件。
  - 例题：求 $38^\circ$ 的余角和补角。 答：余角 $52^\circ$，补角 $142^\circ$。
  - 易错：错说：互为补角的两个角一定相邻。 纠正：错误；补角只由度数和为 $180^\circ$ 决定，与位置无关。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 观察与操作
  page: 2
  teacher:
    questions:
    - 两个角的和为 $90^\circ$ 或 $180^\circ$ 时分别叫什么？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 分别互为余角和互为补角。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 分别互为余角和互为补角。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 概念形成
  page: 2
  teacher:
    questions:
    - 余角、补角有哪些性质？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 同角或等角的余角相等，同角或等角的补角相等；判断关系必须看角度和。
    correction:
    - 用反例检查是否真正满足条件，提醒按“先判断和为 90 还是 180，再列关系式；位置不能代替数量条件”说明。
    example:
    - 基础例题：求 $38^\circ$ 的余角和补角。 规范解答：余角 $52^\circ$，补角 $142^\circ$。
    practice:
    - 即时练习：$64^\circ$ 的余角是多少？ 答案：$26^\circ$。
    summary:
    - 先判断和为 90 还是 180，再列关系式；位置不能代替数量条件
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 同角或等角的余角相等，同角或等角的补角相等；判断关系必须看角度和。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
  figure: complementary_angles
- stage: 图形表示
  page: 2
  teacher:
    questions:
    - 解答“若 $\angle1$ 与 $\angle2$ 互补，且 $\angle1=3\angle2$，求两角。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：设 $\angle2=x$，$3x+x=180^\circ$，得 $45^\circ,135^\circ$。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：若 $\angle1$ 与 $\angle2$ 互补，且 $\angle1=3\angle2$，求两角。 解答：设 $\angle2=x$，$3x+x=180^\circ$，得 $45^\circ,135^\circ$。
    practice:
    - 对应练习：两个锐角一定互余吗？ 答案：不一定，角度和还要等于 $90^\circ$。
    summary:
    - 解题流程：先判断和为 90 还是 180，再列关系式；位置不能代替数量条件。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 设 $\angle2=x$，$3x+x=180^\circ$，得 $45^\circ,135^\circ$。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 7
- stage: 关系应用
  page: 3
  teacher:
    questions:
    - 已知 $\angle A=25^\circ$，$\angle B$ 的余角与 $\angle A$ 相等，求 $\angle B$。
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - $90^\circ-\angle B=25^\circ$，所以 $\angle B=65^\circ$。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：已知 $\angle A=25^\circ$，$\angle B$ 的余角与 $\angle A$ 相等，求 $\angle B$。 解答：$90^\circ-\angle B=25^\circ$，所以 $\angle B=65^\circ$。
    practice:
    - 即时变式：若两角互补且相等，求每个角。 答案：各为 $90^\circ$。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - $90^\circ-\angle B=25^\circ$，所以 $\angle B=65^\circ$。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 条件辨析
  page: 3
  teacher:
    questions:
    - 错说：互为补角的两个角一定相邻。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 错误；补角只由度数和为 $180^\circ$ 决定，与位置无关。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错说：互为补角的两个角一定相邻。
    practice:
    - 纠错要求：写出第一处错误，并按“先判断和为 90 还是 180，再列关系式；位置不能代替数量条件”重做。参考：错误；补角只由度数和为 $180^\circ$ 决定，与位置无关。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 错误；补角只由度数和为 $180^\circ$ 决定，与位置无关。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 综合探究
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①$64^\circ$ 的余角是多少？ ②两个锐角一定互余吗？ ③若两角互补且相等，求每个角。；完成后按答案自查。
    explanation:
    - 答案：①$26^\circ$。 ②不一定，角度和还要等于 $90^\circ$。 ③各为 $90^\circ$。
    correction:
