objectives:
- 说出并解释含括号的一元一次方程，使用本节规范术语表达。
- 按规范步骤完成去括号解方程，并说明关键依据。
- 判断并订正与“括号前负号或系数导致的符号变化”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 去括号解方程
- 解方程步骤的组合
difficulties:
- 括号前负号或系数导致的符号变化
methods:
- 复习迁移
- 规范板演
- 错例纠正
media:
- PPT
- 黑板
- 反馈卡
- 步骤卡
blackboard:
  title: 去括号解一元一次方程
  lines:
  - 核心：去括号、移项、合并同类项、系数化为 1，并代入检验。
  - 方法：去括号逐项乘并检查符号，再按解方程流程完成。
  - 例题：解 $3(x-2)=2x+5$。 答：$3x-6=2x+5$，移项得 $x=11$。
  - 易错：错解：$-2(x-3)=-2x-6$。 纠正：错误；$-2$ 乘 $-3$ 得 $+6$，应为 $-2x+6$。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 依据复习
  page: 2
  teacher:
    questions:
    - 解 $2(x+3)=14$ 时，先做什么？括号前为负号时符号怎样处理？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 先去括号；因数要乘括号内每一项，负号也要逐项作用。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 先去括号；因数要乘括号内每一项，负号也要逐项作用。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 尝试与归纳
  page: 2
  teacher:
    questions:
    - 去括号解一元一次方程的步骤是什么？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 去括号、移项、合并同类项、系数化为 1，并代入检验。
    correction:
    - 用反例检查是否真正满足条件，提醒按“去括号逐项乘并检查符号，再按解方程流程完成”说明。
    example:
    - 基础例题：解 $3(x-2)=2x+5$。 规范解答：$3x-6=2x+5$，移项得 $x=11$。
    practice:
    - 即时练习：解 $4(x+1)=20$。 答案：$x=4$。
    summary:
    - 去括号逐项乘并检查符号，再按解方程流程完成
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 去括号、移项、合并同类项、系数化为 1，并代入检验。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
- stage: 规范示范
  page: 2
  teacher:
    questions:
    - 解答“解 $2(3x+1)-5=9$。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：$6x+2-5=9$，$6x=12$，$x=2$。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：解 $2(3x+1)-5=9$。 解答：$6x+2-5=9$，$6x=12$，$x=2$。
    practice:
    - 对应练习：解 $5-2(x-1)=9$。 答案：$5-2x+2=9$，$-2x=2$，$x=-1$。
    summary:
    - 解题流程：去括号逐项乘并检查符号，再按解方程流程完成。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 $6x+2-5=9$，$6x=12$，$x=2$。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 8
- stage: 变式训练
  page: 3
  teacher:
    questions:
    - 长方形周长 30 cm，长为 $x+2$、宽为 $x-1$，求 $x$。
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - $2[(x+2)+(x-1)]=30$，$4x+2=30$，$x=7$。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：长方形周长 30 cm，长为 $x+2$、宽为 $x-1$，求 $x$。 解答：$2[(x+2)+(x-1)]=30$，$4x+2=30$，$x=7$。
    practice:
    - 即时变式：检验 $x=3$ 是否满足 $2(x+4)=14$。 答案：满足。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - $2[(x+2)+(x-1)]=30$，$4x+2=30$，$x=7$。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 错解诊断
  page: 3
  teacher:
    questions:
    - 错解：$-2(x-3)=-2x-6$。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 错误；$-2$ 乘 $-3$ 得 $+6$，应为 $-2x+6$。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错解：$-2(x-3)=-2x-6$。
    practice:
    - 纠错要求：写出第一处错误，并按“去括号逐项乘并检查符号，再按解方程流程完成”重做。参考：错误；$-2$ 乘 $-3$ 得 $+6$，应为 $-2x+6$。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 错误；$-2$ 乘 $-3$ 得 $+6$，应为 $-2x+6$。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 综合练习
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①解 $4(x+1)=20$。 ②解 $5-2(x-1)=9$。 ③检验 $x=3$ 是否满足 $2(x+4)=14$。；完成后按答案自查。
    explanation:
    - 答案：①$x=4$。 ②$5-2x+2=9$，$-2x=2$，$x=-1$。 ③满足。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：解 $3(x-2)=2x+5$。 学有余力者换一种方法说明；答案要点：$3x-6=2x+5$，移项得 $x=11$。
    summary:
    - 去括号逐项乘并检查符号，再按解方程流程完成
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“去括号逐项乘并检查符号，再按解方程流程完成”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 4
- stage: 当堂检测
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，去括号解一元一次方程的步骤是什么？ ②2 分，解 $5-2(x-1)=9$。 ③2 分，错解：$-2(x-3)=-2x-6$。 ④4 分，长方形周长 30 cm，长为 $x+2$、宽为 $x-1$，求
      $x$。
    explanation:
    - 参考答案：①去括号、移项、合并同类项、系数化为 1，并代入检验。 ②$5-2x+2=9$，$-2x=2$，$x=-1$。 ③错误；$-2$ 乘 $-3$ 得 $+6$，应为 $-2x+6$。 ④$2[(x+2)+(x-1)]=30$，$4x+2=30$，$x=7$。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 6
- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①解 $4(x+1)=20$。 ②解 $5-2(x-1)=9$。 ③检验 $x=3$ 是否满足 $2(x+4)=14$。 ④错解：$-2(x-3)=-2x-6$。；答案：①$x=4$。 ②$5-2x+2=9$，$-2x=2$，$x=-1$。
      ③满足。 ④错误；$-2$ 乘 $-3$ 得 $+6$，应为 $-2x+6$。。B 组：①解 $2(3x+1)-5=9$。 ②长方形周长 30 cm，长为 $x+2$、宽为 $x-1$，求 $x$。；答案要点：①$6x+2-5=9$，$6x=12$，$x=2$。
      ②$2[(x+2)+(x-1)]=30$，$4x+2=30$，$x=7$。。C 组选做：围绕“去括号解一元一次方程”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：去括号逐项乘并检查符号，再按解方程流程完成。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“去括号逐项乘并检查符号，再按解方程流程完成”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
  minutes: 4
