objectives:
- 说出并解释用方程进行推理判断，使用本节规范术语表达。
- 按规范步骤完成方程模型解决实际问题，并说明关键依据。
- 判断并订正与“用方程进行方案比较和不可能性判断”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 方程模型解决实际问题
- 解的实际意义检验
difficulties:
- 用方程进行方案比较和不可能性判断
methods:
- 情境分析
- 数量关系建模
- 检验解释
media:
- PPT
- 黑板
- 反馈卡
- 步骤卡
blackboard:
  title: 实际问题与一元一次方程二
  lines:
  - 核心：明确变化量与总量，用表格表示各方案，列出相等关系并结合实际范围解释解。
  - 方法：建立两种表达式、求临界值、比较临界值两侧、解释实际意义。
  - 例题：方案 A 月费 20 元、每分钟 0.1 元；方案 B 月费 35 元、每分钟 0.05 元，通话多少分钟费用相同？ 答：$20+0.1x=35+0.05x$，$0.05x=15$，$x=300$。
  - 易错：错解：求得比赛胜场数为 $6.5$ 后直接作答。 纠正：错误；场数应为整数，应检查列式或条件。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 问题情境
  page: 2
  teacher:
    questions:
    - 两种计费方案何时费用相同，何时一种更合算？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 分别用未知量表示两种费用，先列方程求临界值，再代入临界值两侧的数据比较。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 分别用未知量表示两种费用，先列方程求临界值，再代入临界值两侧的数据比较。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 数量关系
  page: 2
  teacher:
    questions:
    - 方案比较和积分问题怎样建模？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 明确变化量与总量，用表格表示各方案，列出相等关系并结合实际范围解释解。
    correction:
    - 用反例检查是否真正满足条件，提醒按“建立两种表达式、求临界值、比较临界值两侧、解释实际意义”说明。
    example:
    - 基础例题：方案 A 月费 20 元、每分钟 0.1 元；方案 B 月费 35 元、每分钟 0.05 元，通话多少分钟费用相同？ 规范解答：$20+0.1x=35+0.05x$，$0.05x=15$，$x=300$。
    practice:
    - 即时练习：比较通话 200 分钟时两方案费用。 答案：A 为 40 元，B 为 45 元，A 合算。
    summary:
    - 建立两种表达式、求临界值、比较临界值两侧、解释实际意义
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 明确变化量与总量，用表格表示各方案，列出相等关系并结合实际范围解释解。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
- stage: 模型求解
  page: 2
  teacher:
    questions:
    - 解答“某比赛胜一场得 3 分、负一场得 1 分，共赛 10 场得 24 分，胜几场？”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：设胜 $x$ 场，$3x+(10-x)=24$，得 $x=7$。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：某比赛胜一场得 3 分、负一场得 1 分，共赛 10 场得 24 分，胜几场？ 解答：设胜 $x$ 场，$3x+(10-x)=24$，得 $x=7$。
    practice:
    - 对应练习：胜 6 场负 4 场共得多少分？ 答案：$3\times6+4=22$ 分。
    summary:
    - 解题流程：建立两种表达式、求临界值、比较临界值两侧、解释实际意义。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 设胜 $x$ 场，$3x+(10-x)=24$，得 $x=7$。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 8
- stage: 变式解释
  page: 3
  teacher:
    questions:
    - 租车方案 A 固定 50 元加每千米 2 元，B 固定 20 元加每千米 3 元，多少千米费用相同？
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - $50+2x=20+3x$，$x=30$ km。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：租车方案 A 固定 50 元加每千米 2 元，B 固定 20 元加每千米 3 元，多少千米费用相同？ 解答：$50+2x=20+3x$，$x=30$ km。
    practice:
    - 即时变式：方程解超出实际范围时怎样处理？ 答案：说明模型或条件不适用，不能直接作为实际答案。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - $50+2x=20+3x$，$x=30$ km。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 错误诊断
  page: 3
  teacher:
    questions:
    - 错解：求得比赛胜场数为 $6.5$ 后直接作答。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 错误；场数应为整数，应检查列式或条件。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错解：求得比赛胜场数为 $6.5$ 后直接作答。
    practice:
    - 纠错要求：写出第一处错误，并按“建立两种表达式、求临界值、比较临界值两侧、解释实际意义”重做。参考：错误；场数应为整数，应检查列式或条件。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 错误；场数应为整数，应检查列式或条件。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 方案迁移
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①比较通话 200 分钟时两方案费用。 ②胜 6 场负 4 场共得多少分？ ③方程解超出实际范围时怎样处理？；完成后按答案自查。
    explanation:
    - 答案：①A 为 40 元，B 为 45 元，A 合算。 ②$3\times6+4=22$ 分。 ③说明模型或条件不适用，不能直接作为实际答案。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：方案 A 月费 20 元、每分钟 0.1 元；方案 B 月费 35 元、每分钟 0.05 元，通话多少分钟费用相同？ 学有余力者换一种方法说明；答案要点：$20+0.1x=35+0.05x$，$0.05x=15$，$x=300$。
    summary:
    - 建立两种表达式、求临界值、比较临界值两侧、解释实际意义
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“建立两种表达式、求临界值、比较临界值两侧、解释实际意义”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 4
- stage: 当堂检测
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，方案比较和积分问题怎样建模？ ②2 分，胜 6 场负 4 场共得多少分？ ③2 分，错解：求得比赛胜场数为 $6.5$ 后直接作答。 ④4 分，租车方案 A 固定 50 元加每千米 2 元，B 固定
      20 元加每千米 3 元，多少千米费用相同？
    explanation:
    - 参考答案：①明确变化量与总量，用表格表示各方案，列出相等关系并结合实际范围解释解。 ②$3\times6+4=22$ 分。 ③错误；场数应为整数，应检查列式或条件。 ④$50+2x=20+3x$，$x=30$ km。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 6
- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①比较通话 200 分钟时两方案费用。 ②胜 6 场负 4 场共得多少分？ ③方程解超出实际范围时怎样处理？ ④错解：求得比赛胜场数为 $6.5$ 后直接作答。；答案：①A 为 40 元，B 为 45 元，A 合算。 ②$3\times6+4=22$
      分。 ③说明模型或条件不适用，不能直接作为实际答案。 ④错误；场数应为整数，应检查列式或条件。。B 组：①某比赛胜一场得 3 分、负一场得 1 分，共赛 10 场得 24 分，胜几场？ ②租车方案 A 固定 50 元加每千米 2 元，B
      固定 20 元加每千米 3 元，多少千米费用相同？；答案要点：①设胜 $x$ 场，$3x+(10-x)=24$，得 $x=7$。 ②$50+2x=20+3x$，$x=30$ km。。C 组选做：围绕“实际问题与一元一次方程二”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：建立两种表达式、求临界值、比较临界值两侧、解释实际意义。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“建立两种表达式、求临界值、比较临界值两侧、解释实际意义”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
  minutes: 4
