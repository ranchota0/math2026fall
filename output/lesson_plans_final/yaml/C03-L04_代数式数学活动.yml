objectives:
- 说出并解释在活动中经历列代数式和求值，使用本节规范术语表达。
- 按规范步骤完成代数式综合应用，并说明关键依据。
- 判断并订正与“从活动问题抽象出代数式”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 代数式综合应用
- 活动中的数量关系表达
difficulties:
- 从活动问题抽象出代数式
methods:
- 操作探究
- 合作交流
- 成果互评
media:
- PPT
- 黑板
- 反馈卡
- 任务单
- 小组记录表
blackboard:
  title: 代数式数学活动
  lines:
  - 核心：记录序号与数量，比较相邻变化，提出表达式，再代入已知序号验证。
  - 方法：列表观察、分解图形、建立表达式、代入验证。
  - 例题：数列 $2,5,8,11,\ldots$ 的第 $n$ 项怎样表示？ 答：首项 2、公差 3，表示为 $3n-1$。
  - 易错：错误策略：只凭前三项猜出式子后不检验。 纠正：至少代入前三个序号核对，并说明每一部分对应的图形数量。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 任务说明
  page: 2
  teacher:
    questions:
    - 用火柴棒按同一规律拼图，第 1 个用 4 根，第 2 个用 7 根，第 3 个用 10 根，第 $n$ 个怎样表示？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 每增加一个图形增加 3 根，可表示为 $3n+1$。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 每增加一个图形增加 3 根，可表示为 $3n+1$。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 独立尝试
  page: 2
  teacher:
    questions:
    - 观察规律并列代数式要经历哪些步骤？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 记录序号与数量，比较相邻变化，提出表达式，再代入已知序号验证。
    correction:
    - 用反例检查是否真正满足条件，提醒按“列表观察、分解图形、建立表达式、代入验证”说明。
    example:
    - 基础例题：数列 $2,5,8,11,\ldots$ 的第 $n$ 项怎样表示？ 规范解答：首项 2、公差 3，表示为 $3n-1$。
    practice:
    - 即时练习：用 $n=1,2,3$ 检验 $3n+1$。 答案：分别得 4,7,10，符合。
    summary:
    - 列表观察、分解图形、建立表达式、代入验证
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 记录序号与数量，比较相邻变化，提出表达式，再代入已知序号验证。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
- stage: 小组探究
  page: 2
  teacher:
    questions:
    - 解答“边长为 1 的小正方形排成一行，$n$ 个图形的周长是多少？”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：长为 $n$、宽为 1，周长为 $2n+2$。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：边长为 1 的小正方形排成一行，$n$ 个图形的周长是多少？ 解答：长为 $n$、宽为 1，周长为 $2n+2$。
    practice:
    - 对应练习：若第 $n$ 项为 $2n+3$，求第 5 项。 答案：$13$。
    summary:
    - 解题流程：列表观察、分解图形、建立表达式、代入验证。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 长为 $n$、宽为 1，周长为 $2n+2$。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 8
- stage: 展示交流
  page: 3
  teacher:
    questions:
    - 设计一个第 $n$ 个含 $4n+2$ 个点的点阵规则，并说明 $4n$ 与 2 的含义。
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - 方案合理、图式与表达式对应即可。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：设计一个第 $n$ 个含 $4n+2$ 个点的点阵规则，并说明 $4n$ 与 2 的含义。 解答：方案合理、图式与表达式对应即可。
    practice:
    - 即时变式：比较从表格和从图形发现规律的依据。 答案：都要找不变量和随序号变化的量。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - 方案合理、图式与表达式对应即可。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 7
- stage: 错误修正
  page: 3
  teacher:
    questions:
    - 错误策略：只凭前三项猜出式子后不检验。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 至少代入前三个序号核对，并说明每一部分对应的图形数量。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错误策略：只凭前三项猜出式子后不检验。
    practice:
    - 纠错要求：写出第一处错误，并按“列表观察、分解图形、建立表达式、代入验证”重做。参考：至少代入前三个序号核对，并说明每一部分对应的图形数量。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 至少代入前三个序号核对，并说明每一部分对应的图形数量。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 迁移应用
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①用 $n=1,2,3$ 检验 $3n+1$。 ②若第 $n$ 项为 $2n+3$，求第 5 项。 ③比较从表格和从图形发现规律的依据。；完成后按答案自查。
    explanation:
    - 答案：①分别得 4,7,10，符合。 ②$13$。 ③都要找不变量和随序号变化的量。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：数列 $2,5,8,11,\ldots$ 的第 $n$ 项怎样表示？ 学有余力者换一种方法说明；答案要点：首项 2、公差 3，表示为 $3n-1$。
    summary:
    - 列表观察、分解图形、建立表达式、代入验证
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“列表观察、分解图形、建立表达式、代入验证”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 4
- stage: 反馈评价
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，观察规律并列代数式要经历哪些步骤？ ②2 分，若第 $n$ 项为 $2n+3$，求第 5 项。 ③2 分，错误策略：只凭前三项猜出式子后不检验。 ④4 分，设计一个第 $n$ 个含 $4n+2$ 个点的点阵规则，并说明
      $4n$ 与 2 的含义。
    explanation:
    - 参考答案：①记录序号与数量，比较相邻变化，提出表达式，再代入已知序号验证。 ②$13$。 ③至少代入前三个序号核对，并说明每一部分对应的图形数量。 ④方案合理、图式与表达式对应即可。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 5
- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①用 $n=1,2,3$ 检验 $3n+1$。 ②若第 $n$ 项为 $2n+3$，求第 5 项。 ③比较从表格和从图形发现规律的依据。 ④错误策略：只凭前三项猜出式子后不检验。；答案：①分别得 4,7,10，符合。 ②$13$。
      ③都要找不变量和随序号变化的量。 ④至少代入前三个序号核对，并说明每一部分对应的图形数量。。B 组：①边长为 1 的小正方形排成一行，$n$ 个图形的周长是多少？ ②设计一个第 $n$ 个含 $4n+2$ 个点的点阵规则，并说明 $4n$
      与 2 的含义。；答案要点：①长为 $n$、宽为 1，周长为 $2n+2$。 ②方案合理、图式与表达式对应即可。。C 组选做：围绕“代数式数学活动”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：列表观察、分解图形、建立表达式、代入验证。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“列表观察、分解图形、建立表达式、代入验证”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
  minutes: 4
