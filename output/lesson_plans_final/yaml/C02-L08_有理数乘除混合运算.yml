blackboard:
  title: 有理数乘除混合运算
  lines:
  - 核心：乘除同级从左到右；也可统一转化为乘法后，整体判符号并约分。
  - 方法：同级运算从左到右，或统一为乘法后约分。
  - 例题：计算 $(-18)\div(-3)\times2$。 答：从左到右得 $6\times2=12$。
  - 易错：错解：$12\div(-3)\times(-2)=12\div6=2$。 纠正：错误；不能把后两项先乘，应从左到右，结果 $8$。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 依据复习
  page: 2
  teacher:
    questions:
    - 计算 $-24\div3\times(-2)$，能否先算 $3\times(-2)$？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 乘除同级，应从左到右，原式为 $-8\times(-2)=16$。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 乘除同级，应从左到右，原式为 $-8\times(-2)=16$。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 尝试与归纳
  page: 2
  teacher:
    questions:
    - 有理数乘除混合运算按什么顺序？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 乘除同级从左到右；也可统一转化为乘法后，整体判符号并约分。
    correction:
    - 用反例检查是否真正满足条件，提醒按“同级运算从左到右，或统一为乘法后约分”说明。
    example:
    - 基础例题：计算 $(-18)\div(-3)\times2$。 规范解答：从左到右得 $6\times2=12$。
    practice:
    - 即时练习：计算 $-15\div5\times4$。 答案：$-12$。
    summary:
    - 同级运算从左到右，或统一为乘法后约分
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 乘除同级从左到右；也可统一转化为乘法后，整体判符号并约分。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
- stage: 规范示范
  page: 2
  teacher:
    questions:
    - 解答“计算 $\frac23\div(-\frac49)\times(-2)$。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：$\frac23\times(-\frac94)\times(-2)=3$。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：计算 $\frac23\div(-\frac49)\times(-2)$。 解答：$\frac23\times(-\frac94)\times(-2)=3$。
    practice:
    - 对应练习：计算 $(-8)\times\frac34\div(-2)$。 答案：$3$。
    summary:
    - 解题流程：同级运算从左到右，或统一为乘法后约分。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 $\frac23\times(-\frac94)\times(-2)=3$。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 8
- stage: 变式训练
  page: 3
  teacher:
    questions:
    - 一辆车 3 小时行驶 $-180$ km 的方向量，按相同速度行 2 小时的方向量是多少？
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - $(-180)\div3\times2=-120$ km。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：一辆车 3 小时行驶 $-180$ km 的方向量，按相同速度行 2 小时的方向量是多少？ 解答：$(-180)\div3\times2=-120$ km。
    practice:
    - 即时变式：说明乘除混合统一成乘法时要改变什么。 答案：把除数换成其倒数。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
