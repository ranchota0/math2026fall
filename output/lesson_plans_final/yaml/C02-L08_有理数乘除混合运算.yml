  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 错解诊断
  page: 3
  teacher:
    questions:
    - 错解：$12\div(-3)\times(-2)=12\div6=2$。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 错误；不能把后两项先乘，应从左到右，结果 $8$。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错解：$12\div(-3)\times(-2)=12\div6=2$。
    practice:
    - 纠错要求：写出第一处错误，并按“同级运算从左到右，或统一为乘法后约分”重做。参考：错误；不能把后两项先乘，应从左到右，结果 $8$。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
