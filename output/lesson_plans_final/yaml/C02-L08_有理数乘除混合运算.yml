objectives:
- 说出并解释乘除混合运算，使用本节规范术语表达。
- 按规范步骤完成乘除混合运算顺序，并说明关键依据。
- 判断并订正与“多步运算中的符号和转化”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 乘除混合运算顺序
- 将除法转化为乘法
difficulties:
- 多步运算中的符号和转化
methods:
- 复习迁移
- 规范板演
- 错例纠正
