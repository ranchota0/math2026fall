meta:
  lesson_id: C05-L05
  title: 移项解一元一次方程
  lesson_type: 运算技能课
  source_pages: [122, 123, 124]
  teaching_date:
    year: ''
    month: ''
    day: ''
  unit_total_periods: 8
  topic_total_periods: 1
  current_period: 1

objectives:
  - 说明移项来源于等式的性质，解释“移项要变号”的理由。
  - 按移项、合并同类项、系数化为 1 的步骤解一元一次方程。
  - 判断并订正移项不变号、负系数处理错误，能用代入法检验方程的解。
  - 从简单情境中找出相等关系并列一元一次方程。

key_points:
  - 从等式性质理解移项，并按规范步骤解一元一次方程。

difficulties:
  - 准确识别移动的项及其原符号，解释变号依据并正确处理负系数。

methods:
  - 复习迁移
  - 对比推理
  - 板演纠错

media:
  - PPT
  - 黑板
  - 步骤卡
  - 反馈卡

blackboard:
  title: 移项解一元一次方程
  lines:
    - 依据：等式两边同时加或减同一个式子。
    - 移项：把等式一边的某项变号后移到另一边。
    - 步骤：移项 → 合并同类项 → 系数化为 1 → 检验。
    - 例：$3x+7=32-2x$，移项得 $3x+2x=32-7$。
    - 易错：移动的项不变号；$-ax=b$ 除以负数时丢负号。

process:
  - stage: 复习等式性质
    page: 2
    teacher:
      questions:
        - 由 $x+5=12$ 得 $x=7$，等式两边同时做了什么？
        - 要消去 $3x+7=32-2x$ 右边的 $-2x$，两边应同时加什么？
      actions:
        - 让学生口头说明每一步依据，把“同时做同一种运算”板书在等号两侧。
      explanation:
        - 等式两边同时加或减同一个式子，结果仍相等。
      correction:
        - 若只说“把 5 挪过去”，追问“等式两边实际做了什么”。
      example: []
      practice:
        - 口答：要消去左边的 $+7$，等式两边应同时减去 7。
      summary:
        - 方程变形必须保持等式成立。
    student:
      actions:
        - 解热身方程并完整说出等式性质。
        - 在原方程两边写出相同的加减式。
      expected_response:
        - 两边同时减 5；要消去 $-2x$，两边同时加 $2x$。
    design_intent:
      - 激活等式性质，为解释移项变号提供依据。
    minutes: 5

  - stage: 从等式性质发现移项
    page: 2
    teacher:
      questions:
        - 比较完整变形与简写，$-2x$ 和 $+7$ 的位置、符号发生了什么变化？
        - 符号变化是凭空规定，还是省略了哪一步？
      actions:
        - 先完整写出两边同时加 $2x$、再同时减 7 的过程，再与 $3x+2x=32-7$ 对照。
      explanation:
        - 把等式一边的某项变号后移到另一边，叫作移项；它是等式性质变形的简写。
      correction:
        - 强调“项”包含前面的符号；没有移动的项不能随意变号。
      example:
        - '$3x+7=32-2x \Rightarrow 3x+2x=32-7$。'
      practice:
        - 将 $5x-4=2x+8$ 只做移项，写成 $5x-2x=8+4$，并说明两次变号。
      summary:
        - 移项改变位置，同时改变该项的符号。
    student:
      actions:
        - 圈出移动的两项，比较移项前后的符号。
        - 先写完整等式性质，再写移项简写。
      expected_response:
        - $-2x$ 移到左边变为 $+2x$，$+7$ 移到右边变为 $-7$；本质是等式两边同时加减同一个式子。
    design_intent:
      - 通过两种写法对比，让“移项变号”有可说明的数学依据。
    minutes: 8

  - stage: 例题示范与对应练习
    page: 2
    teacher:
      questions:
        - 解 $3x+7=32-2x$ 时，哪些项应放在同一边？
        - 每一步的任务分别是什么？
      actions:
        - 按“移项—合并同类项—系数化为 1—检验”逐行板演，并让学生口述依据。
      explanation:
        - '$3x+2x=32-7$，$5x=25$，$x=5$；代入得两边都等于 22。'
      correction:
        - 若学生一步写出答案，要求补写三步并在每步右侧标注名称。
      example:
        - '解：$\begin{aligned}3x+7&=32-2x,\\3x+2x&=32-7,\\5x&=25,\\x&=5.\end{aligned}$'
      practice:
        - 解 $4x-3=2x+9$，答案 $x=6$；完成后代入检验。
      summary:
        - 每一步只完成一个明确任务，书写顺序固定。
    student:
      actions:
        - 先说移动哪一项及新符号，再独立完成对应练习。
        - 同桌互查步骤名称和检验结果。
      expected_response:
        - $4x-2x=9+3$，$2x=12$，$x=6$；代入左右两边都为 21。
    design_intent:
      - 用一例一练形成规范书写流程，并让学生把步骤与依据对应起来。
    minutes: 7

  - stage: 变式与负系数
    page: 3
    teacher:
      questions:
        - 解 $x-3=1.5x+1$，移项后为什么得到 $-0.5x=4$？
        - $-0.5x=4$ 的两边应同除以什么？
      actions:
        - 让学生先独立写前两步，再选取“负号丢失”的板演进行比较。
      explanation:
        - '$x-1.5x=1+3$，$-0.5x=4$，两边同除以 $-0.5$，得 $x=-8$。'
      correction:
        - 把“系数化为 1”说完整：两边同除以未知数的系数，包括负号。
      example:
        - '解：$\begin{aligned}x-3&=1.5x+1,\\x-1.5x&=1+3,\\-0.5x&=4,\\x&=-8.\end{aligned}$'
      practice:
        - 解 $2x+1=5x-8$，答案 $x=3$；说明负系数出现在哪一步。
      summary:
        - 负系数化为 1 时，除数必须连同负号。
    student:
      actions:
        - 独立完成变式，圈出 $-0.5$ 和除数。
        - 代入原方程检验 $x=-8$。
      expected_response:
        - 两边同除以 $-0.5$，所以解为 $-8$；代入两边都为 $-11$。
    design_intent:
      - 在紧跟变式中暴露负系数错误，巩固步骤而不是记答案。
    minutes: 7

  - stage: 错例辨析与检验
    page: 3
    teacher:
      questions:
        - 错解“由 $2x-4=12$ 得 $2x=8$”的第一处错误在哪里？
        - 怎样用代入检验快速发现错误？
      actions:
        - 要求学生先判断、再说明理由、最后给出规范订正。
      explanation:
        - $-4$ 移到右边应变为 $+4$，故 $2x=16$，$x=8$；代入检验成立。
      correction:
        - 不接受只写“错误”，必须指出移动的项、符号和正确等式。
      example:
        - 判断 $5x+6=2x$ 移项为 $5x-2x=-6$：正确，两项移项后均变号。
      practice:
        - 判断由 $4x+7=2x-5$ 得 $4x-2x=-5-7$，所以 $x=-6$：正确，并说明两次移项均变号。
      summary:
        - 纠错三步：找第一处错误、写依据、代入检验。
    student:
      actions:
        - 标出第一处错误，写出完整订正并代入检验。
        - 同桌互评理由是否包含“哪一项怎样变号”。
      expected_response:
        - 正确订正为 $2x=12+4$，$x=8$；判断题中的两次移项都改变了符号。
    design_intent:
      - 用错例迫使学生解释规则，并建立代入检验习惯。
    minutes: 5

  - stage: 简单应用
    page: 3
    teacher:
      questions:
        - 两组共整理 55 本书，甲组比乙组的 2 倍少 5 本，若乙组为 $x$ 本，甲组怎样表示？
        - 哪个相等关系可以列方程？
      actions:
        - 按“设未知数—表示相关量—找相等关系—列方程—作答”组织口头建模。
      explanation:
        - 甲组为 $2x-5$，方程 $x+2x-5=55$，解得 $x=20$，甲组 35 本。
      correction:
        - 若把“少 5”写成 $2x+5$，用数量大小反问检验表达式。
      example: []
      practice: []
      summary:
        - 表示同一个总量的关系可以转化为方程。
    student:
      actions:
        - 写出设句和数量关系，口头完成解方程与答语。
      expected_response:
        - $x+(2x-5)=55$，乙组 20 本，甲组 35 本。
    design_intent:
      - 用简短应用题连接教材的问题背景，保持本节重点仍在移项。
    minutes: 3

  - stage: 当堂检测
    page: 4
    teacher:
      questions:
        - 哪一步最容易出现符号错误，如何用检验发现？
      actions:
        - 投放 4 题：①说明移项变号依据；②解 $6x+5=2x+17$；③解 $0.5x-2=x+1$；④订正 $3x-7=8\Rightarrow3x=1$。
      explanation:
        - 答案：等式性质；$x=3$；$x=-6$；应为 $3x=15$，$x=5$。
      correction:
        - 同桌互判后举牌统计；低于 3 题正确者重写一道完整“等式性质版本”。
      example: []
      practice: []
      summary:
        - 达标标准：4 题正确 3 题及以上，并能说明至少一次变号依据。
    student:
      actions:
        - 独立完成，互判后对错误题做代入检验。
      expected_response:
        - 能按三步规范解题并用等式性质解释移项。
    design_intent:
      - 同时检测概念依据、基本技能、负系数和错例订正。
    minutes: 6

  - stage: 回顾总结与作业
    page: 4
    teacher:
      questions:
        - 移项与等式性质是什么关系？
        - 解方程的三步流程是什么？
        - 负系数和移项时各要提醒自己什么？
      actions:
        - 根据学生回答补全板书流程，布置分层作业。
      explanation:
        - 基础巩固：解 $2x+3=11$、$5x-4=2x+8$，订正 $x-6=9\Rightarrow x=3$。提升思考：用一段话解释移项为什么变号，并解 $0.2x+1=0.5x-5$。
      correction:
        - 若学生只背“移项变号”，追问“等式两边实际做了什么”。
      example: []
      practice: []
      summary:
        - 移项是等式性质的简写；规范步骤和代入检验共同保证正确。
    student:
      actions:
        - 用一句话概括移项本质，口述三步流程和一个易错点。
        - 记录分层作业。
      expected_response:
        - 移项相当于等式两边同时加减同一式子；步骤为移项、合并同类项、系数化为 1。
    design_intent:
      - 从口诀回到依据，形成可迁移的解方程流程。
    minutes: 4

reflection:
  mode: blank
  text: ''
