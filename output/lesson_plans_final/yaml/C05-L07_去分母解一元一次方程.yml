- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①解 $\frac x4+1=3$。 ②解 $\frac{2x-1}{5}=1$。 ③说明去分母时整数项是否也要乘公倍数。 ④错解：$\frac{x+1}{3}=2$ 去分母得 $x+1=2$。；答案：①$x=8$。 ②$x=3$。
      ③要，等式两边的每一项都要乘。 ④错误；右边也要乘 3，应得 $x+1=6$，$x=5$。。B 组：①解 $\frac{x+1}{3}-\frac{x-2}{2}=1$。 ②某数的一半减去 3 等于它的三分之一，求这个数。；答案要点：①两边乘
      6：$2(x+1)-3(x-2)=6$，化简得 $-x+8=6$，$x=2$。 ②$\frac x2-3=\frac x3$，两边乘 6 得 $3x-18=2x$，$x=18$。。C 组选做：围绕“去分母解一元一次方程”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：找最小公倍数、每项同乘、分子加括号、按流程求解检验。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“找最小公倍数、每项同乘、分子加括号、按流程求解检验”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
