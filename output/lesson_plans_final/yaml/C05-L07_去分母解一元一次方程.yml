blackboard:
  title: 去分母解一元一次方程
  lines:
  - 核心：找最小公倍数，等式两边每一项都乘它；分子是多项式时加括号，再依次去括号、移项和合并。
  - 方法：找最小公倍数、每项同乘、分子加括号、按流程求解检验。
  - 例题：解 $\frac{x-1}{2}=3$。 答：两边乘 2，得 $x-1=6$，所以 $x=7$。
  - 易错：错解：$\frac{x+1}{3}=2$ 去分母得 $x+1=2$。 纠正：错误；右边也要乘 3，应得 $x+1=6$，$x=5$。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 依据复习
  page: 2
  teacher:
    questions:
    - 方程 $\frac{x-1}{2}=\frac{x+2}{3}$ 中分母怎样消去？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 各分母的最小公倍数为 6，等式两边同乘 6。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 各分母的最小公倍数为 6，等式两边同乘 6。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 尝试与归纳
  page: 2
  teacher:
    questions:
    - 去分母解方程的关键步骤是什么？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 找最小公倍数，等式两边每一项都乘它；分子是多项式时加括号，再依次去括号、移项和合并。
    correction:
    - 用反例检查是否真正满足条件，提醒按“找最小公倍数、每项同乘、分子加括号、按流程求解检验”说明。
    example:
    - 基础例题：解 $\frac{x-1}{2}=3$。 规范解答：两边乘 2，得 $x-1=6$，所以 $x=7$。
    practice:
    - 即时练习：解 $\frac x4+1=3$。 答案：$x=8$。
    summary:
    - 找最小公倍数、每项同乘、分子加括号、按流程求解检验
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 找最小公倍数，等式两边每一项都乘它；分子是多项式时加括号，再依次去括号、移项和合并。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
- stage: 规范示范
  page: 2
  teacher:
    questions:
    - 解答“解 $\frac{x+1}{3}-\frac{x-2}{2}=1$。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：两边乘 6：$2(x+1)-3(x-2)=6$，化简得 $-x+8=6$，$x=2$。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：解 $\frac{x+1}{3}-\frac{x-2}{2}=1$。 解答：两边乘 6：$2(x+1)-3(x-2)=6$，化简得 $-x+8=6$，$x=2$。
    practice:
    - 对应练习：解 $\frac{2x-1}{5}=1$。 答案：$x=3$。
    summary:
    - 解题流程：找最小公倍数、每项同乘、分子加括号、按流程求解检验。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 两边乘 6：$2(x+1)-3(x-2)=6$，化简得 $-x+8=6$，$x=2$。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 8
- stage: 变式训练
  page: 3
  teacher:
    questions:
    - 某数的一半减去 3 等于它的三分之一，求这个数。
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - $\frac x2-3=\frac x3$，两边乘 6 得 $3x-18=2x$，$x=18$。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：某数的一半减去 3 等于它的三分之一，求这个数。 解答：$\frac x2-3=\frac x3$，两边乘 6 得 $3x-18=2x$，$x=18$。
    practice:
    - 即时变式：说明去分母时整数项是否也要乘公倍数。 答案：要，等式两边的每一项都要乘。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - $\frac x2-3=\frac x3$，两边乘 6 得 $3x-18=2x$，$x=18$。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 错解诊断
  page: 3
  teacher:
    questions:
    - 错解：$\frac{x+1}{3}=2$ 去分母得 $x+1=2$。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 错误；右边也要乘 3，应得 $x+1=6$，$x=5$。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错解：$\frac{x+1}{3}=2$ 去分母得 $x+1=2$。
    practice:
    - 纠错要求：写出第一处错误，并按“找最小公倍数、每项同乘、分子加括号、按流程求解检验”重做。参考：错误；右边也要乘 3，应得 $x+1=6$，$x=5$。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 错误；右边也要乘 3，应得 $x+1=6$，$x=5$。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 综合练习
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①解 $\frac x4+1=3$。 ②解 $\frac{2x-1}{5}=1$。 ③说明去分母时整数项是否也要乘公倍数。；完成后按答案自查。
    explanation:
    - 答案：①$x=8$。 ②$x=3$。 ③要，等式两边的每一项都要乘。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：解 $\frac{x-1}{2}=3$。 学有余力者换一种方法说明；答案要点：两边乘 2，得 $x-1=6$，所以 $x=7$。
    summary:
    - 找最小公倍数、每项同乘、分子加括号、按流程求解检验
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“找最小公倍数、每项同乘、分子加括号、按流程求解检验”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 4
- stage: 当堂检测
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，去分母解方程的关键步骤是什么？ ②2 分，解 $\frac{2x-1}{5}=1$。 ③2 分，错解：$\frac{x+1}{3}=2$ 去分母得 $x+1=2$。 ④4 分，某数的一半减去 3 等于它的三分之一，求这个数。
    explanation:
    - 参考答案：①找最小公倍数，等式两边每一项都乘它；分子是多项式时加括号，再依次去括号、移项和合并。 ②$x=3$。 ③错误；右边也要乘 3，应得 $x+1=6$，$x=5$。 ④$\frac x2-3=\frac x3$，两边乘 6
      得 $3x-18=2x$，$x=18$。
    correction:
