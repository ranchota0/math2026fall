objectives:
- 说出并解释含分母的一元一次方程，使用本节规范术语表达。
- 按规范步骤完成去分母，并说明关键依据。
- 判断并订正与“去分母时方程两边每一项都乘最小公倍数”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 去分母
- 一元一次方程一般解法
difficulties:
- 去分母时方程两边每一项都乘最小公倍数
methods:
- 复习迁移
- 规范板演
- 错例纠正
