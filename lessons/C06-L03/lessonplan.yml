objectives:
- 说出并解释直线、射线、线段的概念和表示，使用本节规范术语表达。
- 按规范步骤完成直线、射线、线段，并说明关键依据。
- 判断并订正与“几何图形的符号表示和端点方向区别”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 直线、射线、线段
- 两点确定一条直线
difficulties:
- 几何图形的符号表示和端点方向区别
methods:
- 观察操作
- 画图标注
- 图形说理
media:
- PPT
- 黑板
- 反馈卡
- 直尺
- 量角器或透明纸
blackboard:
  title: 直线射线线段
  lines:
  - 核心：直线无端点向两方无限延伸；射线一个端点向一方延伸；线段两个端点。
  - 方法：结合端点数和延伸方向辨认，再用端点字母规范表示。
  - 例题：用字母表示经过 $A,B$ 的直线、射线和线段。 答：直线 $AB$ 或 $BA$；射线 $AB$ 端点为 $A$；线段 $AB$。
  - 易错：错图：把射线画成两端都有箭头。 纠正：错误；射线只有一个端点，另一端有箭头。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 观察与操作
  page: 2
  teacher:
    questions:
    - 公路、手电筒光线和绷紧的绳子分别更接近直线、射线还是线段？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 公路抽象为直线，手电筒光线抽象为射线，绳子抽象为线段。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 公路抽象为直线，手电筒光线抽象为射线，绳子抽象为线段。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 概念形成
  page: 2
  teacher:
    questions:
    - 直线、射线、线段怎样表示并比较端点和延伸方向？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 直线无端点向两方无限延伸；射线一个端点向一方延伸；线段两个端点。
    correction:
    - 用反例检查是否真正满足条件，提醒按“结合端点数和延伸方向辨认，再用端点字母规范表示”说明。
    example:
    - 基础例题：用字母表示经过 $A,B$ 的直线、射线和线段。 规范解答：直线 $AB$ 或 $BA$；射线 $AB$ 端点为 $A$；线段 $AB$。
    practice:
    - 即时练习：射线 $AB$ 与射线 $BA$ 是否相同？ 答案：一般不同，端点和方向不同。
    summary:
    - 结合端点数和延伸方向辨认，再用端点字母规范表示
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 直线无端点向两方无限延伸；射线一个端点向一方延伸；线段两个端点。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
  figure: line_ray_segment
- stage: 图形表示
  page: 2
  teacher:
    questions:
    - 解答“过平面内两点 $A,B$ 能画几条直线？”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：有且只有一条，体现两点确定一条直线。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：过平面内两点 $A,B$ 能画几条直线？ 解答：有且只有一条，体现两点确定一条直线。
    practice:
    - 对应练习：线段 $AB$ 与 $BA$ 是否相同？ 答案：相同。
    summary:
    - 解题流程：结合端点数和延伸方向辨认，再用端点字母规范表示。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 有且只有一条，体现两点确定一条直线。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 7
- stage: 关系应用
  page: 3
  teacher:
    questions:
    - 三名同学站在不共线的三个点上，两两连接可画几条线段？
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - 3 条：$AB,BC,CA$。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：三名同学站在不共线的三个点上，两两连接可画几条线段？ 解答：3 条：$AB,BC,CA$。
    practice:
    - 即时变式：过一点能画多少条直线？ 答案：无数条。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - 3 条：$AB,BC,CA$。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 条件辨析
  page: 3
  teacher:
    questions:
    - 错图：把射线画成两端都有箭头。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 错误；射线只有一个端点，另一端有箭头。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错图：把射线画成两端都有箭头。
    practice:
    - 纠错要求：写出第一处错误，并按“结合端点数和延伸方向辨认，再用端点字母规范表示”重做。参考：错误；射线只有一个端点，另一端有箭头。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 错误；射线只有一个端点，另一端有箭头。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 综合探究
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①射线 $AB$ 与射线 $BA$ 是否相同？ ②线段 $AB$ 与 $BA$ 是否相同？ ③过一点能画多少条直线？；完成后按答案自查。
    explanation:
    - 答案：①一般不同，端点和方向不同。 ②相同。 ③无数条。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：用字母表示经过 $A,B$ 的直线、射线和线段。 学有余力者换一种方法说明；答案要点：直线 $AB$ 或 $BA$；射线 $AB$ 端点为 $A$；线段 $AB$。
    summary:
    - 结合端点数和延伸方向辨认，再用端点字母规范表示
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“结合端点数和延伸方向辨认，再用端点字母规范表示”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 5
- stage: 当堂检测
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，直线、射线、线段怎样表示并比较端点和延伸方向？ ②2 分，线段 $AB$ 与 $BA$ 是否相同？ ③2 分，错图：把射线画成两端都有箭头。 ④4 分，三名同学站在不共线的三个点上，两两连接可画几条线段？
    explanation:
    - 参考答案：①直线无端点向两方无限延伸；射线一个端点向一方延伸；线段两个端点。 ②相同。 ③错误；射线只有一个端点，另一端有箭头。 ④3 条：$AB,BC,CA$。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 6
- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①射线 $AB$ 与射线 $BA$ 是否相同？ ②线段 $AB$ 与 $BA$ 是否相同？ ③过一点能画多少条直线？ ④错图：把射线画成两端都有箭头。；答案：①一般不同，端点和方向不同。 ②相同。 ③无数条。 ④错误；射线只有一个端点，另一端有箭头。。B
      组：①过平面内两点 $A,B$ 能画几条直线？ ②三名同学站在不共线的三个点上，两两连接可画几条线段？；答案要点：①有且只有一条，体现两点确定一条直线。 ②3 条：$AB,BC,CA$。。C 组选做：围绕“直线射线线段”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：结合端点数和延伸方向辨认，再用端点字母规范表示。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“结合端点数和延伸方向辨认，再用端点字母规范表示”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
  minutes: 4
