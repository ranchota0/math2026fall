objectives:
- 说出并解释线段和差，使用本节规范术语表达。
- 按规范步骤完成线段的和差，并说明关键依据。
- 判断并订正与“根据图形关系表示线段和差”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 线段的和差
- 线段中点
difficulties:
- 根据图形关系表示线段和差
methods:
- 观察操作
