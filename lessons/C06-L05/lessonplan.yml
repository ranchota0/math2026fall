blackboard:
  title: 线段的运算与中点
  lines:
  - 核心：若 $C$ 在线段 $AB$ 上，则 $AB=AC+CB$；若 $M$ 为中点，则 $AM=MB=\frac12AB$。
  - 方法：先确认点在线段上的顺序，再列整体等于部分和或中点关系。
  - 例题：已知 $AB=12$ cm，$M$ 是中点，求 $AM$。 答：$AM=\frac12AB=6$ cm。
  - 易错：错解：只知 $AM=MB$ 就断定 $M$ 是 $AB$ 中点。 纠正：还必须知道 $M$ 在线段 $AB$ 上。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 观察与操作
  page: 2
  teacher:
    questions:
    - 点 $M$ 在线段 $AB$ 上，若 $AM=MB$，$M$ 有什么特殊名称？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - $M$ 是线段 $AB$ 的中点。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - $M$ 是线段 $AB$ 的中点。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 概念形成
  page: 2
  teacher:
    questions:
    - 线段和差与中点关系怎样列式？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 若 $C$ 在线段 $AB$ 上，则 $AB=AC+CB$；若 $M$ 为中点，则 $AM=MB=\frac12AB$。
    correction:
    - 用反例检查是否真正满足条件，提醒按“先确认点在线段上的顺序，再列整体等于部分和或中点关系”说明。
    example:
    - 基础例题：已知 $AB=12$ cm，$M$ 是中点，求 $AM$。 规范解答：$AM=\frac12AB=6$ cm。
    practice:
    - 即时练习：$AB=10$ cm，$AM=5$ cm 且 $M$ 在线段上，判断 $M$ 是否中点。 答案：是，因为 $AM=\frac12AB$。
    summary:
    - 先确认点在线段上的顺序，再列整体等于部分和或中点关系
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 若 $C$ 在线段 $AB$ 上，则 $AB=AC+CB$；若 $M$ 为中点，则 $AM=MB=\frac12AB$。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
  figure: segment_midpoint
- stage: 图形表示
  page: 2
  teacher:
    questions:
    - 解答“点 $C$ 在线段 $AB$ 上，$AC=5$ cm、$CB=3$ cm，求 $AB$。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：$AB=AC+CB=8$ cm。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：点 $C$ 在线段 $AB$ 上，$AC=5$ cm、$CB=3$ cm，求 $AB$。 解答：$AB=AC+CB=8$ cm。
    practice:
    - 对应练习：$AB=15$ cm、$AC=9$ cm，$C$ 在线段上，求 $CB$。 答案：$6$ cm。
    summary:
    - 解题流程：先确认点在线段上的顺序，再列整体等于部分和或中点关系。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 $AB=AC+CB=8$ cm。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 7
- stage: 关系应用
  page: 3
  teacher:
    questions:
    - 一根 18 m 绳子中点处剪开，每段多长？
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - $18\div2=9$ m。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：一根 18 m 绳子中点处剪开，每段多长？ 解答：$18\div2=9$ m。
    practice:
    - 即时变式：若 $M$ 为 $AB$ 中点，写出三个等量关系。 答案：$AM=MB$，$AB=2AM$，$AM=\frac12AB$。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - $18\div2=9$ m。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 条件辨析
  page: 3
  teacher:
    questions:
    - 错解：只知 $AM=MB$ 就断定 $M$ 是 $AB$ 中点。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 还必须知道 $M$ 在线段 $AB$ 上。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错解：只知 $AM=MB$ 就断定 $M$ 是 $AB$ 中点。
    practice:
    - 纠错要求：写出第一处错误，并按“先确认点在线段上的顺序，再列整体等于部分和或中点关系”重做。参考：还必须知道 $M$ 在线段 $AB$ 上。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 还必须知道 $M$ 在线段 $AB$ 上。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 综合探究
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①$AB=10$ cm，$AM=5$ cm 且 $M$ 在线段上，判断 $M$ 是否中点。 ②$AB=15$ cm、$AC=9$ cm，$C$ 在线段上，求 $CB$。 ③若 $M$ 为 $AB$ 中点，写出三个等量关系。；完成后按答案自查。
    explanation:
    - 答案：①是，因为 $AM=\frac12AB$。 ②$6$ cm。 ③$AM=MB$，$AB=2AM$，$AM=\frac12AB$。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：已知 $AB=12$ cm，$M$ 是中点，求 $AM$。 学有余力者换一种方法说明；答案要点：$AM=\frac12AB=6$ cm。
    summary:
    - 先确认点在线段上的顺序，再列整体等于部分和或中点关系
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“先确认点在线段上的顺序，再列整体等于部分和或中点关系”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 5
- stage: 当堂检测
