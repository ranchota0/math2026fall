    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①$AB=10$ cm，$AM=5$ cm 且 $M$ 在线段上，判断 $M$ 是否中点。 ②$AB=15$ cm、$AC=9$ cm，$C$ 在线段上，求 $CB$。 ③若 $M$ 为 $AB$ 中点，写出三个等量关系。
      ④错解：只知 $AM=MB$ 就断定 $M$ 是 $AB$ 中点。；答案：①是，因为 $AM=\frac12AB$。 ②$6$ cm。 ③$AM=MB$，$AB=2AM$，$AM=\frac12AB$。 ④还必须知道 $M$ 在线段
