objectives:
- 说出并解释数轴上的大小顺序，使用本节规范术语表达。
- 按规范步骤完成利用数轴比较有理数大小，并说明关键依据。
- 判断并订正与“负数大小比较中的绝对值反向关系”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 利用数轴比较有理数大小
- 两个负数绝对值大的反而小
difficulties:
- 负数大小比较中的绝对值反向关系
methods:
- 问题引导
- 比较归纳
