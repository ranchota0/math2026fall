blackboard:
  title: 有理数的大小比较
  lines:
  - 核心：数轴上右边的数大；正数大于 $0$，$0$ 大于负数；两个负数绝对值大的反而小。
  - 方法：统一表示形式后，优先用数轴位置或负数绝对值规则比较。
  - 例题：比较 $-3$ 与 $-7$。 答：$|-3|=3<7=|-7|$，所以 $-3>-7$。
  - 易错：错解：因为 $8>3$，所以 $-8>-3$。 纠正：错误；两个负数绝对值大的反而小，应为 $-8<-3$。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
