  page: 2
  teacher:
    questions:
    - 清晨气温 $-5^\circ\mathrm C$，中午为 $2^\circ\mathrm C$，哪个温度高？怎样从数轴说明？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 数轴上 $2$ 在 $-5$ 右侧，所以 $2>-5$。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 数轴上 $2$ 在 $-5$ 右侧，所以 $2>-5$。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 比较与抽象
  page: 2
  teacher:
    questions:
    - 有理数大小比较有哪些规则？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 数轴上右边的数大；正数大于 $0$，$0$ 大于负数；两个负数绝对值大的反而小。
    correction:
    - 用反例检查是否真正满足条件，提醒按“统一表示形式后，优先用数轴位置或负数绝对值规则比较”说明。
    example:
    - 基础例题：比较 $-3$ 与 $-7$。 规范解答：$|-3|=3<7=|-7|$，所以 $-3>-7$。
    practice:
    - 即时练习：比较 $-\frac34$ 与 $-0.8$。 答案：$|-\frac34|=0.75<0.8$，所以 $-\frac34>-0.8$。
    summary:
    - 统一表示形式后，优先用数轴位置或负数绝对值规则比较
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 数轴上右边的数大；正数大于 $0$，$0$ 大于负数；两个负数绝对值大的反而小。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
  figure: axis_points
- stage: 正例示范
  page: 2
  teacher:
    questions:
    - 解答“按从小到大排列 $-2.5,0,3,-\frac12$。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：$-2.5<-\frac12<0<3$。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：按从小到大排列 $-2.5,0,3,-\frac12$。 解答：$-2.5<-\frac12<0<3$。
    practice:
    - 对应练习：在 $-4$ 与 $1$ 之间写出三个整数。 答案：例如 $-3,-2,-1$。
    summary:
    - 解题流程：统一表示形式后，优先用数轴位置或负数绝对值规则比较。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 $-2.5<-\frac12<0<3$。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 7
