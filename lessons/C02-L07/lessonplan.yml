blackboard:
  title: 有理数除法
  lines:
  - 核心：除以不为 $0$ 的数等于乘它的倒数；两数相除同号得正、异号得负。$0$ 不能作除数。
  - 方法：先检查除数不为零，再转化为乘倒数并判符号。
  - 例题：计算 $(-18)\div6$。 答：异号得负，$18\div6=3$，结果 $-3$。
  - 易错：错解：$5\div0=0$。 纠正：错误；$0$ 不能作除数，算式无意义。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
