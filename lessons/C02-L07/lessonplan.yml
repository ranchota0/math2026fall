objectives:
- 说出并解释除法是乘法的逆运算，使用本节规范术语表达。
- 按规范步骤完成有理数除法法则，并说明关键依据。
- 判断并订正与“倒数、符号和除数不为 0 的综合处理”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 有理数除法法则
- 除法转化为乘法
difficulties:
- 倒数、符号和除数不为 0 的综合处理
methods:
- 问题引导
