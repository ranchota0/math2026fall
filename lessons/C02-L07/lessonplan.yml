- stage: 正例示范
  page: 2
  teacher:
    questions:
    - 解答“计算 $(-\frac34)\div(-\frac56)$。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：乘倒数得 $\frac34\times\frac65=\frac9{10}$。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：计算 $(-\frac34)\div(-\frac56)$。 解答：乘倒数得 $\frac34\times\frac65=\frac9{10}$。
    practice:
    - 对应练习：计算 $0\div(-5)$。 答案：$0$。
    summary:
    - 解题流程：先检查除数不为零，再转化为乘倒数并判符号。
  student:
    actions:
