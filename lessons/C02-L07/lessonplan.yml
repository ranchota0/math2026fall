  minutes: 7
- stage: 表示与应用
  page: 3
  teacher:
    questions:
    - 一段海拔变化为 $-18$ m，平均分在 6 个时段，每段变化多少？
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - $(-18)\div6=-3$ m。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：一段海拔变化为 $-18$ m，平均分在 6 个时段，每段变化多少？ 解答：$(-18)\div6=-3$ m。
    practice:
    - 即时变式：计算 $(-2)\div\frac13$。 答案：$(-2)\times3=-6$。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
