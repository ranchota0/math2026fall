- stage: 比较与抽象
  page: 2
  teacher:
    questions:
    - 有理数除法法则是什么？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 除以不为 $0$ 的数等于乘它的倒数；两数相除同号得正、异号得负。$0$ 不能作除数。
    correction:
    - 用反例检查是否真正满足条件，提醒按“先检查除数不为零，再转化为乘倒数并判符号”说明。
    example:
    - 基础例题：计算 $(-18)\div6$。 规范解答：异号得负，$18\div6=3$，结果 $-3$。
    practice:
    - 即时练习：计算 $24\div(-8)$。 答案：$-3$。
    summary:
    - 先检查除数不为零，再转化为乘倒数并判符号
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 除以不为 $0$ 的数等于乘它的倒数；两数相除同号得正、异号得负。$0$ 不能作除数。
  design_intent:
