meta:
  lesson_id: C07-L01
  file_prefix: 7.1.1_相交线与对顶角
  title: 相交线与对顶角
  chapter: 第七章 相交线与平行线
  section: 7.1.1 两条直线相交
  textbook: 人教版《义务教育教科书·数学七年级下册》
  grade: 七年级
  lesson_type: 新授课
  period: 第1课时
  minutes: 45
  printed_pages: 1—3
  pdf_pages: 8—10

curriculum_basis: >-
  通过观察、操作和推理，认识相交线所成角的位置关系与数量关系；能用几何语言说明简单结论，
  在图形观察、分类和说理中发展几何直观、推理能力与应用意识。

textbook_analysis:
  position: 本课是七年级下册几何学习的起点，邻补角和对顶角是后续研究垂线、三线八角以及平行线判定与性质的直接基础。
  connection: 以前一册的角、平角、补角为前置知识，向后连接垂直、平行与初步几何证明。
  intent: 教材先让学生转动两根相交木条，比较四个角的位置和大小，再抽象概念并用补角性质推出对顶角相等。

student_analysis:
  foundation: 学生已认识角、平角、余角和补角，会进行180°内的角度计算。
  difficulties: 容易只凭“面对面”判断对顶角，忽略“有公共顶点且两边互为反向延长线”；也可能把“对顶角相等”误写成“相等的角是对顶角”。
  misconceptions:
    - 有公共顶点且相等的角就是对顶角。
    - 相邻的两个角都是邻补角。
    - 求出一个角后重复用180°计算，未利用对顶角相等简化。

objectives:
  - 通过观察和标注相交线所成的四个角，说出邻补角、对顶角的定义，并能按位置关系正确识别。
  - 借助补角的性质说明“对顶角相等”，能写出两步以内的推理依据。
  - 已知相交线中一个角或相邻两角的数量关系，能计算其余角的度数并检验结果。
  - 在转动木条、比较和交流中形成“先看位置、再用数量”的几何研究习惯。

core_literacies: [几何直观, 推理能力, 运算能力, 应用意识]
key_point: 识别邻补角和对顶角，并运用对顶角相等解决简单角度问题。
difficulty: 从角的两边关系准确说明对顶角，并把补角性质组织成规范推理。
methods: [问题驱动, 操作探究, 例练结合, 同伴互评]
preparation:
  teacher: [两根可转动硬纸条, PPT, 直尺, 实物投影]
  student: [直尺, 量角器, 学案]

flow:
  - stage: 情境导入
    minutes: 3
    ppt: 1—3
    teacher:
      - 展示剪刀、交叉道路和两根相交木条，问：“这些图形中，两条直线的位置关系有什么共同点？”
      - 明确本课研究任务：相交后形成哪些角关系。
    student:
      - 观察并指出两条直线相交，形成四个角。
      - 用自己的语言提出想研究的问题。
    expected: 两条直线相交于一点；形成四个角；角之间可能有位置和大小关系。
    correction: 若学生把线段交叉与直线相交混同，补画反向延长线，强调研究对象是两条直线。
    intent: 从生活模型聚焦“相交线所成角”，形成问题意识。
  - stage: 旧知回顾
    minutes: 4
    ppt: 4
    teacher:
      - 追问：“一条直线形成的平角是多少度？两个角互补是什么意思？”
      - 让学生在图中指出反向延长线和公共边。
    student:
      - 回答平角为180°，两个角的和为180°时互补。
      - 标注反向延长线和公共边。
    expected: 平角180°；互补是数量关系；反向延长线组成一条直线。
    correction: 对“互补一定相邻”的回答给出两个不相邻但和为180°的角作反例。
    intent: 激活定义邻补角和推导性质所需的旧知。
  - stage: 操作探究
    minutes: 8
    ppt: 5
    teacher:
      - 组织学生转动两根硬纸条，给四个角编号1—4，观察位置并测量两组角。
      - 提问：“∠1与∠2有哪些共同与不同？∠1与∠3呢？转动后关系是否保持？”
    student:
      - 动手转动、测量、记录∠1—∠4。
      - 小组比较∠1与∠2、∠1与∠3的位置和数量关系。
    expected: ∠1与∠2有公共边，另外两边互为反向延长线且和为180°；∠1与∠3有公共顶点，两边分别互为反向延长线且度数相等。
    correction: 对量角误差较大的小组，要求先看位置关系，再用角度和验证。
    intent: 让概念和性质从操作事实中自然产生。
  - stage: 概念形成
    minutes: 6
    ppt: 6—7
    teacher:
      - 引导学生概括邻补角与对顶角的定义，并圈出关键词。
      - 依次展示正例和反例，要求按“两边关系”说明理由。
    student:
      - 用“公共边、反向延长线、公共顶点”表述定义。
      - 判断图中角的关系并说明依据。
    expected: 邻补角既相邻又互补；对顶角有公共顶点，且一个角的两边分别是另一个角两边的反向延长线。
    correction: 把“大小相等”从对顶角定义中删去，强调定义是位置关系。
    intent: 从操作语言提升为准确的几何语言。
  - stage: 性质推导
    minutes: 6
    ppt: 8
    teacher:
      - 板书∠1+∠2=180°、∠3+∠2=180°，追问：“为什么能得出∠1=∠3？”
      - 组织同桌互说推理链并补全依据。
    student:
      - 根据同角的补角相等说明∠1=∠3。
      - 写出“因为—所以”的两步推理。
    expected: ∠1和∠3都是∠2的补角，所以∠1=∠3；同理∠2=∠4。
    correction: 若只写“对顶角相等”，要求补充性质的推出过程，区分定义与性质。
    intent: 经历由已知事实推出新结论的初步证明过程。
  - stage: 例题示范
    minutes: 7
    ppt: 9—11
    teacher:
      - 出示教材例1：直线a、b相交，∠1=40°，求∠2、∠3、∠4。
      - 追问“先求哪个角？依据是什么？有没有更简洁的顺序？”并规范书写。
    student:
      - 独立计算后与同桌核对。
      - 说明∠2=140°，∠3=40°，∠4=140°及各步依据。
    expected: 先由邻补角求∠2=180°−40°=140°，再由对顶角相等得∠3=40°、∠4=140°。
    correction: 对把∠2算成40°的错误，让学生先在图上描出∠1与∠2的公共边和反向延长线。
    intent: 形成“先识别关系—再列式—写依据—检验”的解题流程。
  - stage: 分层练习与检测
    minutes: 7
    ppt: 12—14
    teacher:
      - 安排Q4—Q7，巡视记录“位置误判、和差错误、比例整体错误”三类问题。
      - 选择一份正确答案和一份典型错误进行投影互评。
    student:
      - 先独立完成，再按评分点互评并订正。
      - 口头说明比例题中为什么两角和为180°。
    expected: 能正确识别、计算并解释；比例题先设两角为2x、7x，再用邻补角和为180°。
    correction: 对比例题只写2+7=9的学生，追问“9份对应多少度”。
    intent: 检验目标达成，及时暴露并修正关键错误。
  - stage: 总结与作业
    minutes: 4
    ppt: 15
    teacher:
      - 请学生回答：“本节研究了什么？怎样识别？得到什么性质？哪里最容易错？”
      - 布置基础巩固和提升思考两级作业。
    student:
      - 用关键词完成知识结构并进行自评。
      - 记录分层作业。
    expected: 先看位置识别邻补角和对顶角；邻补角和为180°，对顶角相等；相等的角不一定是对顶角。
    correction: 若总结只谈计算，补问“定义依据是什么”。
    intent: 结构化知识并把方法迁移到课后任务。

blackboard:
  - 7.1.1 相交线与对顶角
  - 邻补角：公共边；另外两边互为反向延长线；和为180°
  - 对顶角：公共顶点；两边分别互为反向延长线
  - 性质：对顶角相等
  - 方法：先看位置 → 选关系 → 列式 → 写依据 → 检验
  - 易错：相等的角不一定是对顶角

questions:
  - id: Q1
    section: 课前准备
    prompt: 一个平角等于多少度？若∠A与∠B互补，且∠A=65°，求∠B。
    answer: 平角等于180°；∠B=115°。
    score: 2
    error: 把互补误认为两角相等。
  - id: Q2
    section: 自主探究
    prompt: 两条直线AB、CD相交于点O。写出∠AOC的两个邻补角和一个对顶角。
    answer: 邻补角为∠AOD、∠BOC；对顶角为∠BOD。
    score: 3
    error: 顶点字母未写在中间，或把∠AOD写成对顶角。
  - id: Q3
    section: 合作探究
    prompt: 已知∠1与∠2互为邻补角，∠3与∠2互为邻补角。请补全推出∠1=∠3的理由。
    answer: 因为∠1+∠2=180°，∠3+∠2=180°，所以∠1=∠3（同角的补角相等）。
    score: 3
    error: 直接写“对顶角相等”，没有呈现推出过程。
  - id: Q4
    section: 例题学习
    prompt: 教材例1：如图，两直线a、b相交，∠1=40°，求∠2、∠3、∠4的度数。
    answer: ∠2=140°，∠3=40°，∠4=140°。
    steps:
      - ∠2=180°−∠1=140°（邻补角互补）。
      - ∠3=∠1=40°，∠4=∠2=140°（对顶角相等）。
    score: 4
    error: 把邻补角当成相等，或只写结果不写依据。
  - id: Q5
    section: 基础练习
    prompt: 两直线相交，若其中一个角为35°，其余三个角分别是多少度？
    answer: 145°、35°、145°。
    score: 3
    error: 漏写一个角，或把180°−35°算错。
  - id: Q6
    section: 变式练习
    prompt: 两直线AB、CD相交于点O，∠AOC∶∠BOC=2∶7，求∠BOC和∠AOD。
    answer: ∠BOC=140°，∠AOD=140°。
    steps:
      - 设∠AOC=2x，∠BOC=7x。
      - 2x+7x=180°，解得x=20°。
      - ∠BOC=140°，∠AOD=∠BOC=140°。
    score: 4
    error: 忘记两角是邻补角，或把2∶7直接当成角度。
  - id: Q7
    section: 当堂检测
    prompt: 判断并说明理由：“有公共顶点且相等的两个角一定是对顶角。”
    answer: 错误。对顶角还要求一个角的两边分别是另一个角两边的反向延长线；例如同一顶点处两个相等但不相对的角不是对顶角。
    score: 3
    error: 只根据“相等”判断，忽略位置关系。
  - id: Q8
    section: 当堂检测
    prompt: 两直线相交形成的四个角中，一个角比它的邻补角小60°，求这两个角。
    answer: 60°和120°。
    steps:
      - 设较小角为x°，邻补角为(x+60)°。
      - x+x+60=180，解得x=60。
    score: 4
    error: 把“比……小60°”写成x−60。

homework:
  basic:
    - 完成学案Q5、Q7的订正，并用一句话写出每题依据。
    - 教材第3页练习第2题中取∠α=90°、115°分别计算其余三个角。
  advanced:
    - 完成学案Q8，并画图标出所得的两种角度。
    - 自拟一个“已知相交线中一个角，求其余角”的问题并给出答案。

evaluation:
  - 目标1：Q2、Q7共6分，达到5分视为达成。
  - 目标2：Q3、Q4中的推理依据共4分，达到3分视为达成。
  - 目标3：Q5、Q6、Q8共11分，达到9分视为达成。
  - 课堂观察：操作记录完整、能在小组交流中使用“公共边、反向延长线、对顶角相等”等关键词。

