objectives:
- 说出并解释复习几何图形、直线射线线段和角，使用本节规范术语表达。
- 按规范步骤完成几何图形知识结构，并说明关键依据。
- 判断并订正与“图形语言、符号语言和文字语言的转换”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 几何图形知识结构
- 线段和角的综合
difficulties:
- 图形语言、符号语言和文字语言的转换
methods:
- 结构梳理
- 题组训练
- 错因诊断
media:
- PPT
- 黑板
- 反馈卡
- 步骤卡
blackboard:
  title: 几何图形初步章末小结与复习
  lines:
  - 核心：先读点线角名称，标已知条件，确定点或射线顺序，再列线段或角的和差关系。
  - 方法：先标条件和顺序，再用定义、基本事实与和差关系列式。
  - 例题：$M$ 为 $AB$ 中点，$AB=14$ cm，$C$ 在线段 $MB$ 上且 $MC=2$ cm，求 $AC$。 答：$AM=7$ cm，$AC=AM+MC=9$ cm。
  - 易错：错解：仅凭示意图断定 $M$ 是中点。 纠正：错误；必须有文字条件或相等线段标记。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 知识诊断
  page: 2
  teacher:
    questions:
    - 本章立体与平面图形、点线面体、线段和角怎样组成知识结构？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 由基本图形抽象点线面体，再研究直线射线线段，最后研究角的表示、运算和关系。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 由基本图形抽象点线面体，再研究直线射线线段，最后研究角的表示、运算和关系。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 结构梳理
  page: 2
  teacher:
    questions:
    - 几何综合题如何读图和表达？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 先读点线角名称，标已知条件，确定点或射线顺序，再列线段或角的和差关系。
    correction:
    - 用反例检查是否真正满足条件，提醒按“先标条件和顺序，再用定义、基本事实与和差关系列式”说明。
    example:
    - 基础例题：$M$ 为 $AB$ 中点，$AB=14$ cm，$C$ 在线段 $MB$ 上且 $MC=2$ cm，求 $AC$。 规范解答：$AM=7$ cm，$AC=AM+MC=9$ cm。
    practice:
    - 即时练习：说出直线、射线、线段端点数。 答案：0、1、2。
    summary:
    - 先标条件和顺序，再用定义、基本事实与和差关系列式
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 先读点线角名称，标已知条件，确定点或射线顺序，再列线段或角的和差关系。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
  figure: geometry_review
- stage: 典型题组
  page: 2
  teacher:
    questions:
    - 解答“$OB$ 平分 $\angle AOC=80^\circ$，$OD$ 在 $\angle BOC$ 内且 $\angle BOD=15^\circ$，求 $\angle DOC$。”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：$\angle BOC=40^\circ$，所以 $\angle DOC=25^\circ$。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：$OB$ 平分 $\angle AOC=80^\circ$，$OD$ 在 $\angle BOC$ 内且 $\angle BOD=15^\circ$，求 $\angle DOC$。 解答：$\angle BOC=40^\circ$，所以
      $\angle DOC=25^\circ$。
    practice:
    - 对应练习：求 $35^\circ$ 的补角。 答案：$145^\circ$。
    summary:
    - 解题流程：先标条件和顺序，再用定义、基本事实与和差关系列式。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 $\angle BOC=40^\circ$，所以 $\angle DOC=25^\circ$。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 8
- stage: 方法迁移
  page: 3
  teacher:
    questions:
    - 点 $A,B$ 之间有直线路径 $AB=6$ km 和折线路径 $AC+CB=8$ km，选择较短路线并说明依据。
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - 选择线段 $AB$；两点之间线段最短。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：点 $A,B$ 之间有直线路径 $AB=6$ km 和折线路径 $AC+CB=8$ km，选择较短路线并说明依据。 解答：选择线段 $AB$；两点之间线段最短。
    practice:
    - 即时变式：若 $AB=10$ cm、$M$ 为中点，求 $AM$。 答案：5 cm。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - 选择线段 $AB$；两点之间线段最短。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 6
- stage: 易错诊断
  page: 3
  teacher:
    questions:
    - 错解：仅凭示意图断定 $M$ 是中点。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 错误；必须有文字条件或相等线段标记。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错解：仅凭示意图断定 $M$ 是中点。
    practice:
    - 纠错要求：写出第一处错误，并按“先标条件和顺序，再用定义、基本事实与和差关系列式”重做。参考：错误；必须有文字条件或相等线段标记。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 错误；必须有文字条件或相等线段标记。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 综合训练
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①说出直线、射线、线段端点数。 ②求 $35^\circ$ 的补角。 ③若 $AB=10$ cm、$M$ 为中点，求 $AM$。；完成后按答案自查。
    explanation:
    - 答案：①0、1、2。 ②$145^\circ$。 ③5 cm。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：$M$ 为 $AB$ 中点，$AB=14$ cm，$C$ 在线段 $MB$ 上且 $MC=2$ cm，求 $AC$。 学有余力者换一种方法说明；答案要点：$AM=7$ cm，$AC=AM+MC=9$ cm。
    summary:
    - 先标条件和顺序，再用定义、基本事实与和差关系列式
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“先标条件和顺序，再用定义、基本事实与和差关系列式”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 4
- stage: 当堂检测
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，几何综合题如何读图和表达？ ②2 分，求 $35^\circ$ 的补角。 ③2 分，错解：仅凭示意图断定 $M$ 是中点。 ④4 分，点 $A,B$ 之间有直线路径 $AB=6$ km 和折线路径 $AC+CB=8$
      km，选择较短路线并说明依据。
    explanation:
    - 参考答案：①先读点线角名称，标已知条件，确定点或射线顺序，再列线段或角的和差关系。 ②$145^\circ$。 ③错误；必须有文字条件或相等线段标记。 ④选择线段 $AB$；两点之间线段最短。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 6
- stage: 分层作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①说出直线、射线、线段端点数。 ②求 $35^\circ$ 的补角。 ③若 $AB=10$ cm、$M$ 为中点，求 $AM$。 ④错解：仅凭示意图断定 $M$ 是中点。；答案：①0、1、2。 ②$145^\circ$。 ③5
      cm。 ④错误；必须有文字条件或相等线段标记。。B 组：①$OB$ 平分 $\angle AOC=80^\circ$，$OD$ 在 $\angle BOC$ 内且 $\angle BOD=15^\circ$，求 $\angle DOC$。
      ②点 $A,B$ 之间有直线路径 $AB=6$ km 和折线路径 $AC+CB=8$ km，选择较短路线并说明依据。；答案要点：①$\angle BOC=40^\circ$，所以 $\angle DOC=25^\circ$。 ②选择线段
      $AB$；两点之间线段最短。。C 组选做：围绕“几何图形初步章末小结与复习”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：先标条件和顺序，再用定义、基本事实与和差关系列式。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“先标条件和顺序，再用定义、基本事实与和差关系列式”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
  minutes: 4
