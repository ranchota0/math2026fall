objectives:
- 说出并解释用几何知识设计比赛场地，使用本节规范术语表达。
- 按规范步骤完成几何综合实践，并说明关键依据。
- 判断并订正与“把实际设计约束转化为几何关系”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 几何综合实践
- 场地设计中的数学表达
difficulties:
- 把实际设计约束转化为几何关系
methods:
- 任务驱动
- 合作建模
- 方案评价
media:
- PPT
- 黑板
- 反馈卡
- 任务单
- 小组记录表
blackboard:
  title: 设计学校田径运动会比赛场地
  lines:
  - 核心：明确约束，按比例画草图，标尺寸，计算长度与占地，检查通行和安全后修订。
  - 方法：读需求、定比例尺、画方案、标尺寸、算长度、检查约束、修订表达。
  - 例题：矩形场地长 100 m、宽 60 m，四周留 5 m 安全带，内部可用矩形尺寸。 答：长 $100-10=90$ m，宽 $60-10=50$ m。
  - 易错：错误方案：只画示意图，不写比例尺和尺寸。 纠正：无法检验是否放得下，应补比例尺、关键尺寸和计算。
  - 检查：条件、依据、步骤、符号或单位逐项核对。
process:
- stage: 任务理解
  page: 2
  teacher:
    questions:
    - 学校要在矩形场地中布置直跑道、圆弧区和安全通道，需要先收集哪些尺寸？
    actions:
    - 出示题目或情境，先让学生独立判断，再请两名学生说明依据。
    explanation:
    - 场地长宽、跑道宽度、直道长度、弯道半径和安全距离。
    correction:
    - 若学生只报结论，追问基准、条件或运算依据，要求补成完整句。
    example: []
    practice: []
    summary:
    - 把情境中的信息转化为数学对象和关系。
  student:
    actions:
    - 独立观察或计算，圈出关键信息后口头说明。
    expected_response:
    - 场地长宽、跑道宽度、直道长度、弯道半径和安全距离。
  design_intent:
  - 用具体问题激活先修经验，并明确本节需要解决的核心矛盾。
  minutes: 5
- stage: 信息整理
  page: 2
  teacher:
    questions:
    - 场地设计怎样从需求转化为几何方案？
    actions:
    - 组织观察、比较或试算，板书学生给出的共同点，并逐项核对术语。
    explanation:
    - 明确约束，按比例画草图，标尺寸，计算长度与占地，检查通行和安全后修订。
    correction:
    - 用反例检查是否真正满足条件，提醒按“读需求、定比例尺、画方案、标尺寸、算长度、检查约束、修订表达”说明。
    example:
    - 基础例题：矩形场地长 100 m、宽 60 m，四周留 5 m 安全带，内部可用矩形尺寸。 规范解答：长 $100-10=90$ m，宽 $60-10=50$ m。
    practice:
    - 即时练习：实际 50 m 在 $1:1000$ 图上画多长？ 答案：5 cm。
    summary:
    - 读需求、定比例尺、画方案、标尺寸、算长度、检查约束、修订表达
  student:
    actions:
    - 在图形、算式或表格中标注条件，与同桌归纳共同特征。
    expected_response:
    - 明确约束，按比例画草图，标尺寸，计算长度与占地，检查通行和安全后修订。
  design_intent:
  - 让核心结论由可检验的观察或运算形成，而不是直接记忆。
  minutes: 7
  figure: track_layout
- stage: 方案形成
  page: 2
  teacher:
    questions:
    - 解答“比例尺 $1:1000$，图上 8 cm 表示实际多少米？”前应先确定什么？
    actions:
    - 教师按题意、依据、步骤和结论顺序板演；学生在每一步旁标注作用。
    explanation:
    - 规范解答：实际 $8\times1000=8000$ cm，即 80 m。
    correction:
    - 若一步跳到结论，要求补写关键关系或中间步骤，并用原题条件检验。
    example:
    - 变式例题：比例尺 $1:1000$，图上 8 cm 表示实际多少米？ 解答：实际 $8\times1000=8000$ cm，即 80 m。
    practice:
    - 对应练习：怎样使两条直道在图上保持相同间距且长度相等？ 答案：在多个位置量出相同间距，并标注两条直道的相同长度。
    summary:
    - 解题流程：读需求、定比例尺、画方案、标尺寸、算长度、检查约束、修订表达。
  student:
    actions:
    - 先独立完成，再与板演对照步骤、符号、单位或图形标记。
    expected_response:
    - 能得到 实际 $8\times1000=8000$ cm，即 80 m。，并说出关键依据。
  design_intent:
  - 用完整例题建立可模仿的书写顺序和检查方法。
  minutes: 8
- stage: 计算验证
  page: 3
  teacher:
    questions:
    - 在 $120\times80$ m 场地四周留 5 m，按 $1:1000$ 画内部矩形并标尺寸。
    actions:
    - 要求学生先写条件关系或示意，再完成计算并解释结果；抽取两种方法比较。
    explanation:
    - 内部 $110\times70$ m，图上 $11\times7$ cm。
    correction:
    - 若答案脱离条件或单位，要求回到题干逐项对应并作合理性检查。
    example:
    - 应用例题：在 $120\times80$ m 场地四周留 5 m，按 $1:1000$ 画内部矩形并标尺寸。 解答：内部 $110\times70$ m，图上 $11\times7$ cm。
    practice:
    - 即时变式：方案为什么要保留安全通道？ 答案：满足人员通行和场地边界约束。
    summary:
    - 先识别结构，再选择方法，最后解释结果。
  student:
    actions:
    - 独立列式或作图，小组内互查条件、步骤和答语。
    expected_response:
    - 内部 $110\times70$ m，图上 $11\times7$ cm。
  design_intent:
  - 把核心方法迁移到不同表示方式或实际情境中。
  minutes: 7
- stage: 错误修正
  page: 3
  teacher:
    questions:
    - 错误方案：只画示意图，不写比例尺和尺寸。
    actions:
    - 展示错解，要求学生只圈第一处错误，写出依据后再完整订正。
    explanation:
    - 无法检验是否放得下，应补比例尺、关键尺寸和计算。
    correction:
    - 不接受只写“错”或只改答案；必须指出错误对象、正确规则和订正过程。
    example:
    - 易错辨析：错误方案：只画示意图，不写比例尺和尺寸。
    practice:
    - 纠错要求：写出第一处错误，并按“读需求、定比例尺、画方案、标尺寸、算长度、检查约束、修订表达”重做。参考：无法检验是否放得下，应补比例尺、关键尺寸和计算。
    summary:
    - 纠错顺序：定位错误、说明依据、规范订正、回题检验。
  student:
    actions:
    - 独立找错、写依据、完成订正，再与同桌互评理由是否完整。
    expected_response:
    - 无法检验是否放得下，应补比例尺、关键尺寸和计算。
  design_intent:
  - 利用典型错误暴露概念边界、符号习惯或条件遗漏。
  minutes: 5
- stage: 展示评价
  page: 3
  teacher:
    questions:
    - 三道练习分别考查哪个要点，先做哪一道能最快暴露问题？
    actions:
    - 组织限时题组：①实际 50 m 在 $1:1000$ 图上画多长？ ②怎样使两条直道在图上保持相同间距且长度相等？ ③方案为什么要保留安全通道？；完成后按答案自查。
    explanation:
    - 答案：①5 cm。 ②在多个位置量出相同间距，并标注两条直道的相同长度。 ③满足人员通行和场地边界约束。
    correction:
    - 正确率低于 70% 时暂停机动题，按核心方法示范一道，再让学生订正同类错题。
    example: []
    practice:
    - 机动题：矩形场地长 100 m、宽 60 m，四周留 5 m 安全带，内部可用矩形尺寸。 学有余力者换一种方法说明；答案要点：长 $100-10=90$ m，宽 $60-10=50$ m。
    summary:
    - 读需求、定比例尺、画方案、标尺寸、算长度、检查约束、修订表达
  student:
    actions:
    - 限时完成三题，按概念、步骤或应用给错因分类，并订正一题。
    expected_response:
    - 能够依据“读需求、定比例尺、画方案、标尺寸、算长度、检查约束、修订表达”完成题组并说清错因。
  design_intent:
  - 集中检查方法稳定性，并为反馈测试前的即时补救提供依据。
  minutes: 4
- stage: 成果检测
  page: 4
  teacher:
    questions:
    - 四道反馈题中，哪一题最能检验本节核心方法？
    actions:
    - 投放 10 分反馈卡：①2 分，场地设计怎样从需求转化为几何方案？ ②2 分，怎样使两条直道在图上保持相同间距且长度相等？ ③2 分，错误方案：只画示意图，不写比例尺和尺寸。 ④4 分，在 $120\times80$ m 场地四周留
      5 m，按 $1:1000$ 画内部矩形并标尺寸。
    explanation:
    - 参考答案：①明确约束，按比例画草图，标尺寸，计算长度与占地，检查通行和安全后修订。 ②在多个位置量出相同间距，并标注两条直道的相同长度。 ③无法检验是否放得下，应补比例尺、关键尺寸和计算。 ④内部 $110\times70$ m，图上
      $11\times7$ cm。
    correction:
    - 公布答案后学生自评并举牌统计：9 分及以上完成提高任务；7—8 分订正；7 分以下接受针对性补练。
    example: []
    practice: []
    summary:
    - 达标标准：10 分制 9 分及以上完全达标，7—8 分基本达标，7 分以下补练。
  student:
    actions:
    - 独立完成，按答案自评；把错误标为概念、步骤、条件或表达问题。
    expected_response:
    - 能完成四类题并用核心术语说明至少一道题的依据。
  design_intent:
  - 用概念、技能、纠错和综合四类任务覆盖本节目标。
  minutes: 5
- stage: 回顾总结与作业
  page: 4
  teacher:
    questions:
    - 本节研究了什么、关键步骤是什么、最容易错在哪里？
    actions:
    - 请学生各用一句话回答三个问题，教师据此补全板书并布置分层作业。
    explanation:
    - A 组：①实际 50 m 在 $1:1000$ 图上画多长？ ②怎样使两条直道在图上保持相同间距且长度相等？ ③方案为什么要保留安全通道？ ④错误方案：只画示意图，不写比例尺和尺寸。；答案：①5 cm。 ②在多个位置量出相同间距，并标注两条直道的相同长度。
      ③满足人员通行和场地边界约束。 ④无法检验是否放得下，应补比例尺、关键尺寸和计算。。B 组：①比例尺 $1:1000$，图上 8 cm 表示实际多少米？ ②在 $120\times80$ m 场地四周留 5 m，按 $1:1000$
      画内部矩形并标尺寸。；答案要点：①实际 $8\times1000=8000$ cm，即 80 m。 ②内部 $110\times70$ m，图上 $11\times7$ cm。。C 组选做：围绕“设计学校田径运动会比赛场地”自编一道含易错条件的题并给出解答与检查方法。
    correction:
    - 作业答案必须包含必要步骤或依据；只写结果的题次日先口述方法再补写。
    example: []
    practice: []
    summary:
    - 核心方法：读需求、定比例尺、画方案、标尺寸、算长度、检查约束、修订表达。课后反思区域由任课教师课后填写。
  student:
    actions:
    - 说出一个结论、一个步骤和一个易错点，记录 A、B、C 三组作业。
    expected_response:
    - 能用“读需求、定比例尺、画方案、标尺寸、算长度、检查约束、修订表达”概括本节方法，并知道如何自查。
  design_intent:
  - 由学生完成结构化回顾，把课堂方法迁移到分层课后任务。
  minutes: 4
