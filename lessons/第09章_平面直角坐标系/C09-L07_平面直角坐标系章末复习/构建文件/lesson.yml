meta:
  lesson_id: C09-L07
  section: 小结与复习题9
  title: 平面直角坐标系章末复习
  file_prefix: C09-L07_平面直角坐标系章末复习
  chapter: 第9章 平面直角坐标系
  lesson_type: 复习课
  textbook: 人教版《义务教育教科书·数学七年级下册》
  period: 第1课时
  grade: 七年级
  printed_pages: 83—86
  pdf_pages: 90—93
  needs_figure: true
curriculum_basis: 通过观察、操作、运算、推理或数据分析理解平面直角坐标系章末复习，能用数学语言表达过程和依据，在解决教材问题中发展抽象能力、推理能力、运算能力、模型观念、几何直观或数据意识。
textbook_analysis:
  position: 本课位于平面直角坐标系，核心内容是点的坐标、坐标描述位置、坐标与平移，是本章知识链中的重要一环。
  connection: 以前置知识“第九章全部内容”为基础，并为后续本章综合应用、章末复习和相关知识学习提供方法支撑。
  intent: 教材通过教材小结典型问题与教材复习题9，按情境—探究—结论—应用的路径组织学习。
student_analysis:
  foundation: 学生已经学习第九章全部内容，具备基本观察、计算、作图或整理数据的经验。
  difficulties: 学生可能在“选择适当坐标方法解决综合问题”处出现条件遗漏、表示不规范或方法选择不当。
  misconceptions:
  - 只记“点的坐标”的结论，不检查适用条件。
  - 把“建立“位置—坐标—变化”知识结构”与相近概念或逆命题混淆。
  - 只写结果，不写过程、依据或检验。
objectives:
- 通过阅读、观察或操作，准确说出点的坐标、坐标描述位置、坐标与平移的含义、表示或基本步骤。
- 在Q2—Q4中运用“建立“位置—坐标—变化”知识结构”，能用完整语言、式子、图形或图表说明依据。
- 在基础与变式练习中运用“建立“位置—坐标—变化”知识结构”解决同类问题，并对结果进行检验。
- 在合作探究和互评中形成先审条件、再选方法、规范表达、主动复核的学习习惯。
key_point: 建立“位置—坐标—变化”知识结构
difficulty: 选择适当坐标方法解决综合问题
methods:
- 问题驱动
- 自主学习
- 合作探究
- 例练结合
- 同伴互评
preparation:
  teacher:
  - 教材PDF对应页面
  - 课堂教学PPT
  - 学生学案
  - 实物投影或展示工具
  student:
  - 教材
  - 学案
  - 直尺与必要学习工具
blackboard:
- 平面直角坐标系章末复习
- 1. 点的坐标
- 2. 坐标描述位置
- 3. 坐标与平移
- 方法：建立“位置—坐标—变化”知识结构
- 易错：选择适当坐标方法解决综合问题
flow:
- stage: 情境导入
  teacher:
  - 呈现与“平面直角坐标系章末复习”有关的教材情境或真实问题。
  - 追问：题目中哪些量、图形或数据值得研究？
  student:
  - 观察并提取信息，提出本课问题。
  expected: 能说出本课将研究“点的坐标”。
  intent: 让知识从教材情境或真实任务中自然产生。
  correction: 若只描述表面现象，追问条件、对象和所求。
  minutes: 3
  ppt: 1—3
- stage: 旧知回顾
  teacher:
  - 组织Q1，回顾“第九章全部内容”。
  - 板书连接新旧知识的关键词。
  student:
  - 独立作答后同桌核对。
  expected: 能准确调用一条前置定义、性质或规则。
  intent: 激活本课必需的前置知识。
  correction: 对条件缺失的表述补充反例或完整定义。
  minutes: 4
  ppt: '4'
- stage: 自主探究
  teacher:
  - 布置Q2、Q3，提供图形、数据或操作材料。
  - 围绕难点“选择适当坐标方法解决综合问题”巡视提问。
  student:
  - 阅读、操作、记录并在小组内形成猜想。
  expected: 能从活动中提取“点的坐标、坐标描述位置”的共同特征。
  intent: 经历从具体材料到数学关系的抽象过程。
  correction: 若直接抄结论，要求补写现象、猜想和验证。
  minutes: 8
  ppt: '5'
- stage: 概念形成
  teacher:
  - 依据学生记录形成“点的坐标、坐标描述位置、坐标与平移”的规范表述。
  - 用正例、反例或边界情形检查成立条件。
  student:
  - 补全学案概念栏，并用自己的话解释。
  expected: 能区分概念名称、条件、结论和表示方法。
  intent: 把探究经验提升为可使用的数学知识。
  correction: 对关键词遗漏的答案回到教材原句逐项核对。
  minutes: 6
  ppt: 6—7
- stage: 性质推导
  teacher:
  - 追问“为什么”，围绕“建立“位置—坐标—变化”知识结构”组织说明。
  - 强调每一步的依据和适用条件。
  student:
  - 完成Q3的验证，口头说明推理或计算链。
  expected: 能把结论与定义、运算、图形或数据证据连接。
  intent: 发展推理、运算、模型或数据分析能力。
  correction: 若用结论证明自身，要求重新寻找前置依据。
  minutes: 6
  ppt: 8—9
- stage: 例题示范
  teacher:
  - 出示Q4（对应教材小结典型问题），先遮住解答。
  - 按“条件—方法—过程—检验”板演。
  student:
  - 独立尝试，再对照规范解答订正。
  expected: A'=(2,−3)，在第四象限。
  intent: 示范把概念和方法落实到完整解题过程。
  correction: 没有先确认“建立“位置—坐标—变化”知识结构”的条件，或只写结果不写依据。
  minutes: 7
  ppt: 10—11
- stage: 分层练习
  teacher:
  - 安排Q5—Q7，巡视记录概念、过程和表达三类问题。
  - 选择正确答案和典型错误进行互评。
  student:
  - 完成基础、变式和纠错任务，按评分点互评。
  expected: 能运用“建立“位置—坐标—变化”知识结构”解决同类问题。
  intent: 用梯度练习巩固知识并暴露易错点。
  correction: 对只写结果的答案要求补全依据和检验。
  minutes: 7
  ppt: 12—13
- stage: 检测小结
  teacher:
  - 组织Q8独立检测。
  - 用“点的坐标—坐标描述位置—坐标与平移”梳理知识结构并布置分层作业。
  student:
  - 独立作答、自评目标达成情况。
  expected: 能写出本课关键词、方法和一条需要继续订正的问题。
  intent: 即时评价目标达成并形成结构化认识。
  correction: 若总结只列名词，要求补充条件、作用或步骤。
  minutes: 4
  ppt: 14—15
questions:
- id: Q1
  prompt: 回顾“第九章全部内容”：写出一条与本课有关的定义、性质或计算规则。
  answer: 参考要点：正确表述“第九章全部内容”的核心含义，并说明它与“点的坐标”的联系。
  steps: []
  score: 2
  error: 只写关键词，没有说明含义或使用条件。
- id: Q2
  prompt: 阅读教材印刷页83—86，圈出“点的坐标、坐标描述位置、坐标与平移”，分别用一句话记录它们解决什么问题。
  answer: 点的坐标：按教材定义、性质或步骤准确表述；坐标描述位置：按教材定义、性质或步骤准确表述；坐标与平移：按教材定义、性质或步骤准确表述。
  steps: []
  score: 3
  error: 把概念名称、成立条件和结论混在一起。
- id: Q3
  prompt: 小组探究：围绕“选择适当坐标方法解决综合问题”设计一次观察、操作或推理，记录现象、猜想和验证依据。
  answer: 参考思路：先明确条件，再围绕“建立“位置—坐标—变化”知识结构”形成猜想，最后用定义、计算、图表或反例验证。
  steps: []
  score: 3
  error: 只给结论，没有记录验证过程或依据。
- id: Q4
  prompt: 例题（对应教材小结典型问题）：点A(−1,2)向右3、向下5得到A'，求A'并判断所在象限。
  answer: A'=(2,−3)，在第四象限。
  steps:
  - 提取已知条件与所求
  - 选择“建立“位置—坐标—变化”知识结构”对应的方法
  - 规范计算或说明并回到原题检验
  score: 4
  error: 没有先确认“建立“位置—坐标—变化”知识结构”的条件，或只写结果不写依据。
- id: Q5
  prompt: 基础辨析：判断“使用‘点的坐标’时不需要检查条件，只要结论看起来合理即可”，并说明理由。
  answer: 错误。必须先核对“点的坐标”的定义或成立条件，再作出结论。
  steps: []
  score: 3
  error: 只写对错，没有指出需要检查的条件。
- id: Q6
  prompt: 变式练习：把Q4的一个条件、数据或表示方式作合理改变，仍用“建立“位置—坐标—变化”知识结构”解决，并写出检验。
  answer: 答案不唯一。评价要点：改变后的条件完整；方法仍属于“建立“位置—坐标—变化”知识结构”；过程正确；检验与新条件一致。
  steps:
  - 说明改变了什么
  - 给出完整解答
  - 核对答案是否满足新条件
  score: 4
  error: 改变条件后仍照抄原结果，或新题条件不完整。
- id: Q7
  prompt: 纠错：“研究平面直角坐标系章末复习时，只记结论，不必区分条件、过程和依据。”这句话对吗？
  answer: 不对。应围绕“建立“位置—坐标—变化”知识结构”写清条件、过程和依据；否则结论可能被误用。
  steps: []
  score: 3
  error: 用“我觉得”代替定义、运算、图形或数据证据。
- id: Q8
  prompt: 当堂检测：概括“坐标确定位置”和“坐标变化描述平移”的对应关系。
  answer: 有序数对唯一确定点；横坐标变化对应左右平移，纵坐标变化对应上下平移。
  steps:
  - 独立完成并写出关键依据
  - 用定义、代入、逆算、数轴或图表复核
  score: 4
  error: 忽略“选择适当坐标方法解决综合问题”，或结果未回到题意检验。
homework:
  basic:
  - 完成教材复习题9中的基础题并订正Q5、Q7
  - 把本课“点的坐标、坐标描述位置、坐标与平移”整理成三行知识卡
  advanced:
  - 当堂检测：概括“坐标确定位置”和“坐标变化描述平移”的对应关系。
  - 从复习题9分层选题中选择一题，写出完整依据和检验
evaluation:
- 目标1：Q1、Q2共5分，达到4分视为达成。
- 目标2：Q3、Q4共7分，达到5分视为达成。
- 目标3：Q5—Q8共14分，达到11分视为达成。
- 过程评价：记录完整、交流有依据、订正能说明错误原因。
