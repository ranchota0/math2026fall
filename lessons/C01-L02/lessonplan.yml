objectives:
- 说出并解释整数、分数和有理数，使用本节规范术语表达。
- 按规范步骤完成有理数的概念，并说明关键依据。
- 判断并订正与“有限小数、无限循环小数与分数形式的关系”有关的常见错误。
- 在变式或实际情境中运用本节方法，完整写出过程和结论。
key_points:
- 有理数的概念
- 按不同标准进行有理数分类
difficulties:
- 有限小数、无限循环小数与分数形式的关系
methods:
- 问题引导
- 比较归纳
- 正反例辨析
