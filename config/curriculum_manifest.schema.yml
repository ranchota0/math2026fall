$schema: "https://json-schema.org/draft/2020-12/schema"
title: curriculum_manifest
type: object
required:
  - metadata
  - chapters
  - lessons
properties:
  metadata:
    type: object
    required:
      - status
      - source_pdf
      - textbook_confirmed
      - approved
      - default_period_minutes
      - generated_at
      - total_chapters
      - total_lessons
      - notes
    properties:
      status:
        type: string
        enum:
          - draft
          - pending_review
          - approved
      source_pdf:
        type: string
      textbook_confirmed:
        type: boolean
      approved:
        type: boolean
      default_period_minutes:
        type: integer
        minimum: 1
      generated_at:
        type: string
      total_chapters:
        type: integer
        minimum: 1
      total_lessons:
        type: integer
        minimum: 1
      notes:
        type: string
    additionalProperties: true
  chapters:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - chapter_id
        - chapter_title
        - source_pages
        - proposed_periods
        - chapter_notes
      properties:
        chapter_id:
          type: string
          pattern: "^C[0-9]{2}$"
        chapter_title:
          type: string
          minLength: 1
        source_pages:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 1
        proposed_periods:
          type: integer
          minimum: 1
        chapter_notes:
          type: string
      additionalProperties: true
  lessons:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - chapter_id
        - chapter_title
        - lesson_index_in_chapter
        - lesson_title
        - lesson_type
        - source_section
        - source_subsections
        - source_pages
        - period_minutes
        - content_scope
        - key_points
        - difficulties
        - prerequisites
        - integrated_columns
        - status
      properties:
        id:
          type: string
          pattern: "^C[0-9]{2}-L[0-9]{2}$"
        sample:
          type: boolean
        chapter_id:
          type: string
          pattern: "^C[0-9]{2}$"
        chapter_title:
          type: string
          minLength: 1
        lesson_index_in_chapter:
          type: integer
          minimum: 1
        lesson_title:
          type: string
          minLength: 1
        lesson_type:
          type: string
          enum:
            - new_lesson
            - practice_lesson
            - activity_lesson
            - review_lesson
            - integrated_practice
            - optional_extension
        source_section:
          type: string
          minLength: 1
        source_subsections:
          type: array
          items:
            type: string
        source_pages:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 1
        period_minutes:
          type: integer
          minimum: 1
        content_scope:
          type: array
          minItems: 1
          items:
            type: string
        key_points:
          type: array
          minItems: 1
          items:
            type: string
        difficulties:
          type: array
          minItems: 1
          items:
            type: string
        prerequisites:
          type: array
          items:
            type: string
        integrated_columns:
          type: array
          items:
            type: string
        excluded_content:
          type: array
          items:
            type: string
        teacher_output:
          type: string
        student_output:
          type: string
        status:
          type: string
          enum:
            - pending
            - drafting
            - generated
            - compiled
            - reviewed
            - approved
            - blocked
        review_notes:
          type: string
      additionalProperties: true
additionalProperties: true
